version: "2"
run:
  allow-parallel-runners: true
  # Lint the e2e specs too, which only build with the e2e tag.
  build-tags:
    - e2e
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - kubeapilinter
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
      kubeapilinter:
        type: module
        description: Kube API Linter lints Kube like APIs based on API conventions and best practices.
        settings:
          linters:
            # enable:
            #   # TODO: add MinLength/MinItems by hand.
            #   - minlength
            #   # TODO: add MaxLength/MaxItems by hand.
            #   - maxlength
            #   - statussubresource
            #   - statusoptional
            disable:
              # TODO: add Minimum=1 to observedGeneration so it stays a value; the approval counts and some structs need omitzero.
              - optionalfields
              # TODO: mostly adds omitempty to required fields, and a pointer only where a zero value is still valid.
              - requiredfields
              - nonpointerstructs
          lintersConfig:
            conditions:
              # TODO: set to Warn and move Conditions to the top of each status struct.
              isFirstField: Ignore
              useProtobuf: Forbid
              usePatchStrategy: Forbid
            defaults:
              preferredDefaultMarker: kubebuilder:default
            optionalfields:
              pointers:
                preference: WhenRequired
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - kubeapilinter
        path-except: api/*
    paths:
      - third_party$
      - builtin$
      - examples$
      - ui/
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
