apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: scanner
    app.kubernetes.io/name: kokumi
  name: kokumi-scanner
  namespace: kokumi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: scanner
      app.kubernetes.io/name: kokumi
  template:
    metadata:
      labels:
        app.kubernetes.io/component: scanner
        app.kubernetes.io/name: kokumi
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --listen=:8080
        - --cache-dir=/cache
        - --trivy=/usr/local/bin/trivy
        - --max-concurrent=2
        command:
        - /kokumi/scanner
        - serve
        env:
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /tmp
        image: ghcr.io/aquasecurity/trivy@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        name: scanner
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /kokumi
          name: kokumi
          readOnly: true
        - mountPath: /cache
          name: cache
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      initContainers:
      - command:
        - /scanner
        - install
        - /kokumi/scanner
        image: ghcr.io/kokumi-dev/kokumi:latest
        imagePullPolicy: IfNotPresent
        name: install
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /kokumi
          name: kokumi
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kokumi-scanner
      volumes:
      - emptyDir:
          sizeLimit: 256Mi
        name: kokumi
      - emptyDir:
          sizeLimit: 16Gi
        name: cache
      - emptyDir:
          sizeLimit: 2Gi
        name: tmp
