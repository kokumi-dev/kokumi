      - approvals
  validations:
  - expression: request.operation != 'CREATE' || request.userInfo.username == variables.serverSA
    message: Approvals can only be submitted through the kokumi server
    reason: Forbidden
  - expression: request.operation != 'UPDATE'
    message: Approvals are immutable
    reason: Forbidden
  - expression: request.operation != 'DELETE' || request.userInfo.username == variables.namespaceController
    message: Approvals are append-only and cannot be deleted
    reason: Forbidden
  variables:
  - expression: '''system:serviceaccount:kokumi:kokumi-server'''
    name: serverSA
  - expression: '''system:serviceaccount:kube-system:namespace-controller'''
    name: namespaceController
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kokumi-argocd-secret-integrity
  namespace: kokumi
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == 'system:serviceaccount:kokumi:kokumi-controller-manager'
    name: controller
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argocd
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - secrets
  validations:
  - expression: variables.newIsRegistration && variables.oldIsRegistration
    message: In Argo CD's namespace, the kokumi controller may only write the cluster
      Secrets it manages
    reason: Forbidden
  variables:
  - expression: request.operation == 'DELETE' || (object.metadata.?labels[?'app.kubernetes.io/managed-by'].orValue('')
      == 'kokumi' && object.metadata.?labels[?'argocd.argoproj.io/secret-type'].orValue('')
      == 'cluster')
    name: newIsRegistration
  - expression: request.operation == 'CREATE' || (oldObject.metadata.?labels[?'app.kubernetes.io/managed-by'].orValue('')
      == 'kokumi' && oldObject.metadata.?labels[?'argocd.argoproj.io/secret-type'].orValue('')
      == 'cluster')
    name: oldIsRegistration
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kokumi-cluster-secret-access
  namespace: kokumi
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - delivery.kokumi.dev
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - clusters
  validations:
  - expression: variables.secretUnchanged || variables.canGetSecret
    messageExpression: '''A Cluster may only name a Secret its author may get: you
      may not get Secret '' + object.spec.kubeconfig.secretRef.name + '' in namespace
      '' + object.metadata.namespace'
    reason: Forbidden
  variables:
  - expression: request.operation == 'UPDATE' && oldObject.spec.?kubeconfig.secretRef.name.orValue('')
      == object.spec.?kubeconfig.secretRef.name.orValue('') && oldObject.spec.?kubeconfig.secretRef.key.orValue('value')
      == object.spec.?kubeconfig.secretRef.key.orValue('value')
    name: secretUnchanged
  - expression: '!has(object.spec.kubeconfig) || authorizer.group('''').resource(''secrets'').namespace(object.metadata.namespace)
      .name(object.spec.kubeconfig.secretRef.name).check(''get'').allowed()'
    name: canGetSecret
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kokumi-registry-secret-access
  namespace: kokumi
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - delivery.kokumi.dev
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - registries
  validations:
  - expression: variables.connectionUnchanged || variables.canGetSecret
    messageExpression: '''A Registry may only name a Secret its author may get: you
      may not get Secret '' + object.spec.secretRef.name + '' in namespace '' + object.metadata.namespace'
    reason: Forbidden
  - expression: variables.connectionUnchanged || variables.canGetCertSecret
    messageExpression: '''A Registry may only name a Secret its author may get: you
      may not get Secret '' + object.spec.certSecretRef.name + '' in namespace ''
      + object.metadata.namespace'
    reason: Forbidden
  variables:
  - expression: request.operation == 'UPDATE' && oldObject.spec.url == object.spec.url
      && oldObject.spec.?scheme.orValue('HTTPS') == object.spec.?scheme.orValue('HTTPS')
      && oldObject.spec.?secretRef.name.orValue('') == object.spec.?secretRef.name.orValue('')
      && oldObject.spec.?certSecretRef.name.orValue('') == object.spec.?certSecretRef.name.orValue('')
    name: connectionUnchanged
  - expression: '!has(object.spec.secretRef) || authorizer.group('''').resource(''secrets'').namespace(object.metadata.namespace)
      .name(object.spec.secretRef.name).check(''get'').allowed()'
    name: canGetSecret
  - expression: '!has(object.spec.certSecretRef) || authorizer.group('''').resource(''secrets'').namespace(object.metadata.namespace)
      .name(object.spec.certSecretRef.name).check(''get'').allowed()'
    name: canGetCertSecret
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kokumi-signing-key-integrity
  namespace: kokumi
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kokumi-signing
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resourceNames:
      - kokumi-signing-key
      resources:
      - secrets
  validations:
  - expression: request.userInfo.username == variables.controller || variables.clusterAdmin
      || (request.operation == 'DELETE' && request.userInfo.username == variables.namespaceController)
    message: The signing key can only be written by the kokumi controller and cluster
      admins (verb manage-signing-key on kitchens)
    reason: Forbidden
  variables:
  - expression: '''system:serviceaccount:kokumi:kokumi-controller-manager'''
    name: controller
  - expression: '''system:serviceaccount:kube-system:namespace-controller'''
    name: namespaceController
  - expression: authorizer.group('delivery.kokumi.dev').resource('kitchens').namespace('kokumi').name('default')
      .check('manage-signing-key').allowed()
    name: clusterAdmin
---
