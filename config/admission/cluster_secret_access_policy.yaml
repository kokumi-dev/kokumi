---
# A Cluster lends the credential in its kubeconfig Secret to every Order of
# the Environments that select it: Kokumi reads it with its own identity and
# hands it to Argo CD. So only whoever may read that Secret may name it in a
# Cluster. An update that keeps the Secret and its key needs no access to
# the Secret: another key could hold another credential.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-secret-access
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["delivery.kokumi.dev"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE"]
      resources: ["clusters"]
  variables:
  - name: secretUnchanged
    expression: >-
      request.operation == 'UPDATE' &&
      oldObject.spec.?kubeconfig.secretRef.name.orValue('') == object.spec.?kubeconfig.secretRef.name.orValue('') &&
      oldObject.spec.?kubeconfig.secretRef.key.orValue('value') == object.spec.?kubeconfig.secretRef.key.orValue('value')
  - name: canGetSecret
    expression: >-
      !has(object.spec.kubeconfig) ||
      authorizer.group('').resource('secrets').namespace(object.metadata.namespace)
      .name(object.spec.kubeconfig.secretRef.name).check('get').allowed()
  validations:
  - expression: "variables.secretUnchanged || variables.canGetSecret"
    messageExpression: >-
      'A Cluster may only name a Secret its author may get: you may not get Secret ' +
      object.spec.kubeconfig.secretRef.name + ' in namespace ' + object.metadata.namespace
    reason: Forbidden
