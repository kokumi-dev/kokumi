---
# A Registry lends the credentials in its Secrets to every Product and Order
# that lists it, and Kokumi reads them with its own identity. So only whoever
# may read those Secrets may name them in a Registry. An update that leaves
# the url, the scheme and both Secret references as they are needs no access
# to the Secrets; changing the url or switching to HTTP would send the
# credentials somewhere else, so it does.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: registry-secret-access
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["delivery.kokumi.dev"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE"]
      resources: ["registries"]
  variables:
  - name: connectionUnchanged
    expression: >-
      request.operation == 'UPDATE' &&
      oldObject.spec.url == object.spec.url &&
      oldObject.spec.?scheme.orValue('HTTPS') == object.spec.?scheme.orValue('HTTPS') &&
      oldObject.spec.?secretRef.name.orValue('') == object.spec.?secretRef.name.orValue('') &&
      oldObject.spec.?certSecretRef.name.orValue('') == object.spec.?certSecretRef.name.orValue('')
  - name: canGetSecret
    expression: >-
      !has(object.spec.secretRef) ||
      authorizer.group('').resource('secrets').namespace(object.metadata.namespace)
      .name(object.spec.secretRef.name).check('get').allowed()
  - name: canGetCertSecret
    expression: >-
      !has(object.spec.certSecretRef) ||
      authorizer.group('').resource('secrets').namespace(object.metadata.namespace)
      .name(object.spec.certSecretRef.name).check('get').allowed()
  validations:
  - expression: "variables.connectionUnchanged || variables.canGetSecret"
    messageExpression: >-
      'A Registry may only name a Secret its author may get: you may not get Secret ' +
      object.spec.secretRef.name + ' in namespace ' + object.metadata.namespace
    reason: Forbidden
  - expression: "variables.connectionUnchanged || variables.canGetCertSecret"
    messageExpression: >-
      'A Registry may only name a Secret its author may get: you may not get Secret ' +
      object.spec.certSecretRef.name + ' in namespace ' + object.metadata.namespace
    reason: Forbidden
