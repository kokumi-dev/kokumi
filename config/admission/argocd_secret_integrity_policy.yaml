---
# Kokumi registers clusters with Argo CD in declarative cluster Secrets in
# Argo CD's namespace, and the role that lets it may write any Secret there
# (the names are hashes, so RBAC cannot name them). This policy keeps the
# controller to its own cluster Secrets: what it creates, changes or deletes
# there must carry app.kubernetes.io/managed-by: kokumi and
# argocd.argoproj.io/secret-type: cluster, before and after. Argo CD's own
# Secrets, repository credentials and the registrations of others stay out
# of its reach. The names assume the default install (namespace "kokumi",
# name prefix "kokumi-") and Argo CD in "argocd".
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argocd-secret-integrity
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argocd
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["secrets"]
  matchConditions:
  - name: controller
    expression: "request.userInfo.username == 'system:serviceaccount:kokumi:kokumi-controller-manager'"
  variables:
  - name: newIsRegistration
    expression: >-
      request.operation == 'DELETE' ||
      (object.metadata.?labels[?'app.kubernetes.io/managed-by'].orValue('') == 'kokumi' &&
      object.metadata.?labels[?'argocd.argoproj.io/secret-type'].orValue('') == 'cluster')
  - name: oldIsRegistration
    expression: >-
      request.operation == 'CREATE' ||
      (oldObject.metadata.?labels[?'app.kubernetes.io/managed-by'].orValue('') == 'kokumi' &&
      oldObject.metadata.?labels[?'argocd.argoproj.io/secret-type'].orValue('') == 'cluster')
  validations:
  - expression: "variables.newIsRegistration && variables.oldIsRegistration"
    message: "In Argo CD's namespace, the kokumi controller may only write the cluster Secrets it manages"
    reason: Forbidden
