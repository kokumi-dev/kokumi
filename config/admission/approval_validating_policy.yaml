---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: approval-validate-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["delivery.kokumi.dev"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["approvals"]
  variables:
    - name: isKokumiServer
      expression: 'request.userInfo.username == "system:serviceaccount:kokumi:kokumi-server"'
  validations:
    - expression: "request.operation != 'DELETE'"
      message: "Approvals are append-only and cannot be deleted"
      reason: Forbidden
    - expression: "request.operation != 'UPDATE'"
      message: "Approvals are immutable and cannot be updated"
      reason: Forbidden
    - expression: >-
        request.operation == 'DELETE' || variables.isKokumiServer || (
          object.spec.approver.username == request.userInfo.username &&
          object.spec.approver.groups == request.userInfo.groups &&
          !has(object.spec.approver.email)
        )
      message: "approver identity must match the authenticated Kubernetes user"
      reason: Forbidden
