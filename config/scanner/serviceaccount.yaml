---
# The kokumi-scanner ServiceAccount. The scanner never talks to the
# Kubernetes API: it gets no token and no RBAC. Every request of the manager
# carries the registry connections it needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner
  namespace: system
  labels:
    app.kubernetes.io/component: scanner
    app.kubernetes.io/name: kokumi
automountServiceAccountToken: false
