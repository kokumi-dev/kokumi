---
# The kokumi-server ServiceAccount. It holds NO permissions on kokumi
# resources: every user-facing operation is executed via impersonation of the
# ServiceAccount mapped to the logged-in identity, so plain Kubernetes RBAC on
# those mapped ServiceAccounts is the single source of truth for what a user
# can do (identical for UI and kubectl).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
  namespace: system
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: kokumi
---
# Built-in identity ServiceAccounts. Users are mapped to these via the
# kokumi.dev/identity-* annotations (see docs); permissions come exclusively
# from ordinary RoleBindings/ClusterRoleBindings on them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
  namespace: system
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: kokumi
  annotations:
    # The built-in admin login (auth.adminUser) always acts as this
    # ServiceAccount; no identity annotation is needed for it. OIDC users can
    # additionally be mapped here, e.g.:
    # kokumi.dev/identity-groups: "kokumi-admins"
    kokumi.dev/description: "Full access; used by the built-in admin login"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: editor
  namespace: system
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: kokumi
  annotations:
    kokumi.dev/description: "Create/update/delete kokumi resources; map users via kokumi.dev/identity-* annotations"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: system
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: kokumi
  annotations:
    kokumi.dev/description: "Read-only access; map users via kokumi.dev/identity-* annotations"
---
# ClusterRoles for the built-in identity ServiceAccounts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-role
rules:
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - menus
  - orders
  - preparations
  - recipes
  - servings
  - pantries
  - kitchens
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Pantry docker-registry credentials: the UI stores/reads these on the user's
# behalf when saving a Pantry with direct credentials or resolving an Order
# source that references a Pantry.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-editor-role
rules:
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - menus
  - orders
  - preparations
  - recipes
  - servings
  - pantries
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  # kitchens (auth/system config) are deliberately excluded: only the admin
  # role may change them.
# Pantry docker-registry credentials: the UI stores/reads these on the user's
# behalf when saving a Pantry with direct credentials or resolving an Order
# source that references a Pantry.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-viewer-role
rules:
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - menus
  - orders
  - preparations
  - recipes
  - servings
  - pantries
  - kitchens
  verbs:
  - get
  - list
  - watch
---
# Bind the roles to the identity ServiceAccounts. The server ServiceAccount is
# deliberately NOT bound to any of them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-admin-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-role
subjects:
- kind: ServiceAccount
  name: admin
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-editor-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-editor-role
subjects:
- kind: ServiceAccount
  name: editor
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-viewer-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-viewer-role
subjects:
- kind: ServiceAccount
  name: viewer
  namespace: system
---
# The server's own (minimal) permissions in its namespace:
#  - impersonate the identity ServiceAccounts (this is the trust boundary: the
#    server can act as any mapped SA, so access to this SA is cluster-admin
#    equivalent for kokumi resources)
#  - read ServiceAccounts to resolve identity mappings
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-impersonator
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-impersonator-binding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: server-impersonator
subjects:
- kind: ServiceAccount
  name: server
  namespace: system
---
# Namespaced access to the admin credentials Secret used for login, plus
# list/watch on Secrets in the install namespace so the auth-config informer
# works (the Role's resourceNames restriction above cannot grant list/watch).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-auth-reader
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-auth-reader-binding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: server-auth-reader
subjects:
- kind: ServiceAccount
  name: server
  namespace: system
---
# The server watches the Kitchen singleton (auth config reload) via its
# informer cache. It also holds read-only (get/list/watch) access to the
# kokumi resources: the SSE hub builds snapshots from the server's informer
# cache, and each connected user only receives events for resources their
# mapped ServiceAccounts may list (checked per connection via
# SelfSubjectAccessReview). The server never writes kokumi resources with its
# own identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-kitchen-watcher
rules:
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - kitchens
  - menus
  - orders
  - preparations
  - recipes
  - servings
  - pantries
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-kitchen-watcher-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-kitchen-watcher
subjects:
- kind: ServiceAccount
  name: server
  namespace: system
