---
# The kokumi-server ServiceAccount. It holds NO write permissions on kokumi
# resources except creating Approvals: every other user-facing operation is
# executed via impersonation of the ServiceAccount mapped to the logged-in
# identity, so plain Kubernetes RBAC on those mapped ServiceAccounts is the
# single source of truth for what a user can do (identical for UI and kubectl).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
  namespace: system
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: kokumi
---
# Built-in identity ServiceAccounts. Users are mapped to these via the
# kokumi.dev/identity-* annotations (see docs); permissions come exclusively
# from ordinary RoleBindings/ClusterRoleBindings on them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
  namespace: system
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: kokumi
  annotations:
    # The built-in admin login (auth.adminUser) always acts as this
    # ServiceAccount. OIDC users can additionally be mapped here.
    kokumi.dev/description: "Full access; used by the built-in admin login"
    kokumi.dev/identity-groups: "kokumi-admin"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: editor
  namespace: system
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: kokumi
  annotations:
    kokumi.dev/description: "Create/update/delete kokumi resources"
    kokumi.dev/identity-groups: "kokumi-editor"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: system
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: kokumi
  annotations:
    kokumi.dev/description: "Read-only access"
    kokumi.dev/identity-groups: "kokumi-viewer"
---
# ClusterRoles for the built-in identity ServiceAccounts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-role
rules:
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - menus
  - orders
  - preparations
  - recipes
  - servings
  - pantries
  - kitchens
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Approvals are submitted by the kokumi server on the user's behalf; the
# custom "approve" verb on preparations decides who may vote.
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - approvals
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - preparations
  verbs:
  - approve
# Pantry docker-registry credentials: the UI stores/reads these on the user's
# behalf when saving a Pantry with direct credentials or resolving an Order
# source that references a Pantry.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-editor-role
rules:
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - menus
  - orders
  - preparations
  - recipes
  - servings
  - pantries
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  # kitchens (auth/system config) are deliberately excluded: only the admin
  # role may change them.
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - approvals
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - preparations
  verbs:
  - approve
# Pantry docker-registry credentials: the UI stores/reads these on the user's
# behalf when saving a Pantry with direct credentials or resolving an Order
# source that references a Pantry.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-viewer-role
rules:
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - menus
  - orders
  - preparations
  - recipes
  - servings
  - pantries
  - kitchens
  - approvals
  verbs:
  - get
  - list
  - watch
---
# Bind the roles to the identity ServiceAccounts. The server ServiceAccount is
# deliberately NOT bound to any of them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-admin-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-role
subjects:
- kind: ServiceAccount
  name: admin
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-editor-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-editor-role
subjects:
- kind: ServiceAccount
  name: editor
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-viewer-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-viewer-role
subjects:
- kind: ServiceAccount
  name: viewer
  namespace: system
---
# The server's own (minimal) permissions in its namespace:
#  - impersonate only the built-in identity ServiceAccounts (admin, editor,
#    viewer). This is the trust boundary: access to the server ServiceAccount
#    is cluster-admin equivalent for kokumi resources, so the impersonatable
#    set is pinned by resourceNames. Custom identity ServiceAccounts require
#    adding their name to this list.
#  - read ServiceAccounts to resolve identity mappings
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-impersonator
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  resourceNames:
  - admin
  - editor
  - viewer
  verbs:
  - impersonate
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-impersonator-binding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: server-impersonator
subjects:
- kind: ServiceAccount
  name: server
  namespace: system
---
# Get-only access to the named auth Secrets (admin credentials, OIDC client
# secret, token signing key). List/watch are not granted: the server polls
# these Secrets by name instead of watching them (internal/server/watcher.go).
# Naming: server-auth is kustomize-managed (config/server/secret.yaml) so the
# namePrefix rewrites it via auth_nameref_config.yaml; kokumi-server-oidc and
# kokumi-server-tokens are literal runtime names (created by 'make oidc' and
# the Kitchen controller; also the names the Kitchen spec references).
# Custom secret names via the Kitchen spec (adminUser.secretRef,
# oidc.clientSecretRef, tokenSigningKeySecretRef) require adding them here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-auth-reader
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - server-auth
  - kokumi-server-oidc
  - kokumi-server-tokens
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-auth-reader-binding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: server-auth-reader
subjects:
- kind: ServiceAccount
  name: server
  namespace: system
---
# The server watches the Kitchen singleton (auth config reload) via its
# informer cache. It also holds read-only (get/list/watch) access to the
# kokumi resources: the SSE hub builds snapshots from the server's informer
# cache, and each connected user only receives events for resources their
# mapped ServiceAccounts may list (checked per connection via
# SelfSubjectAccessReview). Apart from submitting Approvals (see
# server-approval-submitter), the server never writes kokumi resources with
# its own identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-kitchen-watcher
rules:
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - kitchens
  - menus
  - orders
  - preparations
  - recipes
  - servings
  - pantries
  - approvals
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-kitchen-watcher-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-kitchen-watcher
subjects:
- kind: ServiceAccount
  name: server
  namespace: system
---
# The only write the server performs with its own identity: submitting
# Approvals. The approver is taken from the verified OIDC session, which only
# the server knows; the approval-integrity admission policy rejects Approvals
# from any other identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-approval-submitter
rules:
- apiGroups:
  - delivery.kokumi.dev
  resources:
  - approvals
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-approval-submitter-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-approval-submitter
subjects:
- kind: ServiceAccount
  name: server
  namespace: system
