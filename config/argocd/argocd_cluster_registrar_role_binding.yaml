# Bound in argocd only: the controller writes cluster Secrets there and
# nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kokumi-argocd-cluster-registrar
  namespace: argocd
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kokumi-argocd-cluster-registrar
subjects:
- kind: ServiceAccount
  name: kokumi-controller-manager
  namespace: kokumi
