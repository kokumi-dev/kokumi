# Teaches kustomize that a Role's rules[].resourceNames may reference a
# Secret or a ServiceAccount. Without this, the namePrefix is applied to the
# object's metadata.name but not to the resourceNames entry that grants access
# to it, breaking RBAC whenever a namePrefix (or nameSuffix) is configured.
# With it, resourceNames automatically tracks the final name for any
# prefix/suffix.
nameReference:
- kind: Secret
  version: v1
  fieldSpecs:
  - kind: Role
    group: rbac.authorization.k8s.io
    path: rules/resourceNames
- kind: ServiceAccount
  version: v1
  fieldSpecs:
  - kind: Role
    group: rbac.authorization.k8s.io
    path: rules/resourceNames
