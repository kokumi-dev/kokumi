---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: orders.delivery.kokumi.dev
spec:
  group: delivery.kokumi.dev
  names:
    kind: Order
    listKind: OrderList
    plural: orders
    singular: order
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .spec.productRef.name
      name: Product
      type: string
    - jsonPath: .status.latestPreparationName
      name: Latest Preparation
      type: string
    - jsonPath: .spec.promotion.mode
      name: Promotion
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Order is the Schema for the orders API.
          An Order is a variant of a Product, such as one environment of an
          application.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Order
            properties:
              destination:
                description: |-
                  destination defines where the rendered Preparation artifact will be pushed.
                  When omitted, the in-cluster registry is used automatically.
                properties:
                  url:
                    description: |-
                      url is the oci:// URL of the repository the artifact is pushed to.
                      When omitted, a repository of the bundled registry is used.
                    maxLength: 2048
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid OCI URL
                      rule: isURL(self) && url(self).getScheme() == 'oci'
                type: object
              edits:
                description: |-
                  edits defines UI-driven field modifications applied after patches.
                  They are intended for interactive changes made through the web UI and
                  are subject to the Product's patch overrides.
                items:
                  description: Patch defines a modification to apply to a resource
                  properties:
                    set:
                      additionalProperties:
                        type: string
                      description: |-
                        set contains JSONPath expressions and their values to set
                        Keys are JSONPath expressions (e.g., ".spec.replicas")
                        Values are the desired values for those paths
                      type: object
                    target:
                      description: target identifies which resource to patch
                      properties:
                        kind:
                          description: kind specifies the Kubernetes resource kind
                            to patch
                          type: string
                        name:
                          description: name specifies the name of the resource to
                            patch
                          type: string
                        namespace:
                          description: namespace specifies the namespace of the resource
                            (optional, defaults to same namespace as Order)
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                  required:
                  - set
                  - target
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-type: atomic
              patches:
                description: |-
                  patches are merged over the Product's patches, per target, before
                  producing a Preparation. Subject to the Product's overrides.
                items:
                  description: Patch defines a modification to apply to a resource
                  properties:
                    set:
                      additionalProperties:
                        type: string
                      description: |-
                        set contains JSONPath expressions and their values to set
                        Keys are JSONPath expressions (e.g., ".spec.replicas")
                        Values are the desired values for those paths
                      type: object
                    target:
                      description: target identifies which resource to patch
                      properties:
                        kind:
                          description: kind specifies the Kubernetes resource kind
                            to patch
                          type: string
                        name:
                          description: name specifies the name of the resource to
                            patch
                          type: string
                        namespace:
                          description: namespace specifies the namespace of the resource
                            (optional, defaults to same namespace as Order)
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                  required:
                  - set
                  - target
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-type: atomic
              productRef:
                description: |-
                  productRef references the Product in the Order's namespace that this
                  Order is a variant of. It cannot be changed after creation.
                properties:
                  name:
                    description: |-
                      name is the name of the Product. The Product must exist in the same
                      namespace as the Order.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: productRef is immutable
                  rule: self == oldSelf
              promotion:
                description: promotion configures how new Preparations become active
                  Servings.
                properties:
                  approvals:
                    description: |-
                      approvals configures an approval gate on the promoted artifact. When
                      set, the Preparation is blocked from being served until enough
                      distinct approvers from the listed groups have approved it, in both
                      Automatic and Manual mode. When omitted, no approval gate applies.
                      The policy is copied into each Preparation when it is created, so a
                      change produces a new Preparation that needs fresh approvals.
                    properties:
                      allowedGroups:
                        description: allowedGroups lists the groups whose members
                          are eligible to approve.
                        items:
                          maxLength: 253
                          type: string
                        maxItems: 16
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                      requiredApprovals:
                        description: requiredApprovals is the minimum number of distinct
                          eligible approvers.
                        format: int32
                        maximum: 32
                        minimum: 1
                        type: integer
                    required:
                    - allowedGroups
                    - requiredApprovals
                    type: object
                  mode:
                    default: Manual
                    description: |-
                      mode controls how a newly created Preparation becomes the active Serving.
                      Automatic promotes it immediately; Manual requires explicit promotion.
                    enum:
                    - Automatic
                    - Manual
                    type: string
                type: object
              registryRefs:
                description: |-
                  registryRefs lists Registries in the Order's namespace. Kokumi
                  connects to the destination through the one whose url covers it,
                  the longest when several do. The source, the images and the vendor
                  location belong to the Product, and its registryRefs connect to them.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              values:
                description: |-
                  values holds Helm values deep-merged over the Product's
                  render.helm.values; the Order's values win. Only valid when the
                  Product renders with Helm, and subject to the Product's overrides.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - productRef
            type: object
          status:
            description: status defines the observed state of Order
            properties:
              conditions:
                description: conditions represent the current state of the Order resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              latestArtifactDigest:
                description: |-
                  latestArtifactDigest is the SHA256 digest of the OCI artifact produced by the
                  most recent Preparation. It is used as the pointer for the parentDigest of
                  the next Preparation.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              latestConfigHash:
                description: |-
                  latestConfigHash is a SHA-256 hash of the intent: the resolved source and
                  destination OCI URLs plus version, render, patches, edits, and approval
                  policy after merging the Order over its Product.
                type: string
              latestPreparationName:
                description: |-
                  latestPreparationName is the name of the most recent immutable Preparation
                  produced from this Order
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller
                format: int64
                type: integer
              registryAccess:
                description: |-
                  registryAccess lists the registry locations the Order needs: where
                  Kokumi pushes the Preparation and through which Registry, where Argo
                  CD pulls it from, and where the kubelet pulls the images of the
                  latest Preparation from. Argo CD and the kubelet need their own
                  credentials for the locations listed for them.
                items:
                  description: |-
                    RegistryAccess is a registry location a Product or an Order needs, who
                    accesses it, and the Registry that authenticates Kokumi there. Kokumi
                    gives no credentials to Argo CD and the kubelet: they need their own for
                    the locations reported for them.
                  properties:
                    client:
                      description: client is who accesses the location.
                      enum:
                      - Kokumi
                      - ArgoCD
                      - Kubelet
                      type: string
                    operation:
                      description: operation is what client does there.
                      enum:
                      - Pull
                      - Push
                      type: string
                    registry:
                      description: |-
                        registry names the Registry whose connection Kokumi uses there. It is
                        empty when Kokumi accesses the location anonymously, and for the
                        other clients.
                      maxLength: 253
                      type: string
                    url:
                      description: url is the location, or the prefix of the locations,
                        accessed.
                      maxLength: 2048
                      type: string
                  required:
                  - client
                  - operation
                  - url
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - url
                - operation
                - client
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.productRef.name
    served: true
    storage: true
    subresources:
      status: {}
