---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: servings.delivery.kokumi.dev
spec:
  group: delivery.kokumi.dev
  names:
    kind: Serving
    listKind: ServingList
    plural: servings
    singular: serving
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.orderName
      name: Order
      type: string
    - jsonPath: .spec.preparationName
      name: Preparation
      priority: 1
      type: string
    - jsonPath: .status.targetPreparationName
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=='Approved')].reason
      name: Approved
      type: string
    - jsonPath: .status.conditions[?(@.type=='Verified')].reason
      name: Verified
      type: string
    - jsonPath: .status.conditions[?(@.type=='UpstreamDeployed')].reason
      name: Upstream
      priority: 1
      type: string
    - jsonPath: .status.history[0].preparationName
      name: Latest
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Serving is the Schema for the servings API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Serving
            properties:
              orderName:
                description: orderName is the name of the Order to serve
                type: string
              preparationName:
                description: |-
                  preparationName is the Preparation promoted for Manual promotion.
                  It is ignored when the Order uses Automatic promotion.
                type: string
            required:
            - orderName
            type: object
          status:
            description: status defines the observed state of Serving
            properties:
              conditions:
                description: conditions represent the current state of the Serving
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deployedVulnerabilities:
                description: |-
                  deployedVulnerabilities sums the latest scans of the images of the
                  deployed Preparation. It keeps changing after the deployment, as new
                  vulnerabilities are published.
                properties:
                  critical:
                    description: critical counts the findings of severity Critical.
                    format: int32
                    minimum: 0
                    type: integer
                  fixable:
                    description: fixable counts the findings a newer version of the
                      package fixes.
                    format: int32
                    minimum: 0
                    type: integer
                  high:
                    description: high counts the findings of severity High.
                    format: int32
                    minimum: 0
                    type: integer
                  low:
                    description: low counts the findings of severity Low.
                    format: int32
                    minimum: 0
                    type: integer
                  medium:
                    description: medium counts the findings of severity Medium.
                    format: int32
                    minimum: 0
                    type: integer
                  unknown:
                    description: unknown counts the findings without a severity.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              history:
                description: |-
                  history lists the most recent deployments, newest first. The deployed
                  Preparation is the newest entry with a promotionRecord; an entry
                  without one is a promotion that is being recorded.
                items:
                  description: |-
                    DeploymentEntry is one continuous deployment of a Preparation by a
                    Serving: from its promotion, or its recovery, until it is superseded or
                    degraded. It is self-contained, so its records can be read after the
                    Preparation is gone.
                  properties:
                    deploymentRecord:
                      description: |-
                        deploymentRecord is the digest of the signed deployment record, a
                        referrer of the artifact pushed once the deployment was healthy.
                      maxLength: 71
                      pattern: ^sha256:[a-f0-9]{64}$
                      type: string
                    digest:
                      description: digest is the digest of the Preparation's artifact.
                      maxLength: 71
                      pattern: ^sha256:[a-f0-9]{64}$
                      type: string
                    endReason:
                      description: endReason says why the deployment ended.
                      enum:
                      - Superseded
                      - Degraded
                      type: string
                    endedTime:
                      description: endedTime is when the deployment ended.
                      format: date-time
                      type: string
                    healthyTime:
                      description: |-
                        healthyTime is when Argo CD first reported the deployment synced and
                        healthy at the digest.
                      format: date-time
                      type: string
                    ociRef:
                      description: ociRef is the full OCI reference of the artifact,
                        including digest.
                      maxLength: 2048
                      type: string
                    preparationName:
                      description: preparationName is the name of the deployed Preparation.
                      maxLength: 253
                      minLength: 1
                      type: string
                    productRevision:
                      description: productRevision is the Product revision the Preparation
                        renders.
                      maxLength: 71
                      pattern: ^sha256:[a-f0-9]{64}$
                      type: string
                    promotionRecord:
                      description: |-
                        promotionRecord is the digest of the signed promotion record, a
                        referrer of the artifact. A recovery carries the record of the
                        promotion it continues.
                      maxLength: 71
                      pattern: ^sha256:[a-f0-9]{64}$
                      type: string
                    registryRef:
                      description: |-
                        registryRef names the Registry that pushed the artifact, through which
                        its records are read.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    startedTime:
                      description: startedTime is when the Preparation passed its
                        gates, or recovered.
                      format: date-time
                      type: string
                  required:
                  - digest
                  - ociRef
                  - preparationName
                  - productRevision
                  - startedTime
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller
                format: int64
                type: integer
              targetPreparationName:
                description: |-
                  targetPreparationName is the Preparation the Serving is converging to
                  once it is approved and its evidence verifies: spec.preparationName
                  for Manual promotion, or the newest Ready Preparation of the Order for
                  Automatic promotion, after it passed its upstream stages and checks.
                  Its approvals are sealed when it becomes the target.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
