---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: products.delivery.kokumi.dev
spec:
  group: delivery.kokumi.dev
  names:
    kind: Product
    listKind: ProductList
    plural: products
    singular: product
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .spec.source.oci
      name: Source
      type: string
    - jsonPath: .spec.source.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=='SourceVerified')].status
      name: Verified
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Product is the Schema for the products API.
          A Product defines an application completely; Orders in the same namespace
          reference it and add their own values, patches, and promotion settings.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Product
            properties:
              images:
                default: {}
                description: |-
                  images configures how the container images the rendered manifests
                  reference are recorded, pinned or vendored. It applies to every Order
                  of the Product.
                properties:
                  fieldSpecs:
                    description: |-
                      fieldSpecs lists the fields of custom resources that hold image
                      references, in addition to the containers, initContainers,
                      ephemeralContainers and image volumes of every Pod template.
                    items:
                      description: |-
                        ImageFieldSpec locates a field that holds a container image reference, in
                        the shape of a kustomize FieldSpec.
                      properties:
                        group:
                          description: |-
                            group is the API group of the resources. Empty matches the core group
                            and every other group.
                          maxLength: 253
                          type: string
                        kind:
                          description: kind is the kind of the resources, for example
                            "Prometheus".
                          maxLength: 63
                          minLength: 1
                          type: string
                        path:
                          description: |-
                            path is the slash-separated path to the field, with [] for every
                            element of a list, for example "spec/image" or
                            "spec/sidecars[]/image".
                          maxLength: 256
                          minLength: 1
                          type: string
                        version:
                          description: |-
                            version is the API version of the resources. Empty matches every
                            version.
                          maxLength: 63
                          type: string
                      required:
                      - kind
                      - path
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: atomic
                  policy:
                    default: Record
                    description: |-
                      policy controls what Kokumi does with the images: Record lists them by
                      digest, Pin also rewrites the manifests to those digests, and Vendor
                      copies each image into a repository of its own below the Order's
                      destination, <destination>/images/<image name>, and rewrites the
                      manifests to pull them from there.
                    enum:
                    - Record
                    - Pin
                    - Vendor
                    type: string
                  pullSecretRef:
                    description: |-
                      pullSecretRef names a kubernetes.io/dockerconfigjson Secret in the
                      Product's namespace whose credentials are used, per registry host, to
                      resolve and vendor the images. Like a Pod's imagePullSecrets, it lets
                      everyone who may edit the Product use these credentials. Without it,
                      registries are accessed anonymously.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              overrides:
                default: {}
                description: |-
                  overrides controls what Orders may change. By default Orders may not
                  set any Helm values, patches, or edits.
                properties:
                  patches:
                    default: {}
                    description: patches controls which patches and edits Orders may
                      set.
                    properties:
                      policy:
                        default: None
                        description: |-
                          policy controls which patches and edits Orders may set.
                          None: Orders may not set any patches or edits.
                          Listed: Orders may patch and edit only the paths listed in targets.
                          All: Orders may patch and edit anything.
                        enum:
                        - None
                        - Listed
                        - All
                        type: string
                      targets:
                        description: |-
                          targets lists the patch targets and paths that Orders may patch or
                          edit. Only used when policy is Listed.
                        items:
                          description: AllowedPatchTarget defines which patch target
                            and JSON paths Orders may use.
                          properties:
                            paths:
                              description: |-
                                paths lists the allowed JSONPath expressions within the target
                                (e.g. ".spec.replicas").
                              items:
                                type: string
                              minItems: 1
                              type: array
                            target:
                              description: |-
                                target identifies the resource that Orders may patch. A target without
                                a namespace matches the resource in any namespace.
                              properties:
                                kind:
                                  description: kind specifies the Kubernetes resource
                                    kind to patch
                                  type: string
                                name:
                                  description: name specifies the name of the resource
                                    to patch
                                  type: string
                                namespace:
                                  description: namespace specifies the namespace of
                                    the resource (optional, defaults to same namespace
                                    as Order)
                                  type: string
                              required:
                              - kind
                              - name
                              type: object
                          required:
                          - paths
                          - target
                          type: object
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                    x-kubernetes-validations:
                    - message: targets must be set when policy is Listed, and only
                        then
                      rule: 'has(self.policy) && self.policy == ''Listed'' ? has(self.targets)
                        : !has(self.targets)'
                  values:
                    default: {}
                    description: values controls which Helm values Orders may set.
                    properties:
                      paths:
                        description: |-
                          paths lists the dot-separated Helm value paths that Orders may set
                          (e.g. "ui.message", "replicaCount"). Only used when policy is Listed.
                        items:
                          type: string
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                      policy:
                        default: None
                        description: |-
                          policy controls which Helm values Orders may set.
                          None: Orders may not set any values.
                          Listed: Orders may set only the values listed in paths.
                          All: Orders may set any value.
                        enum:
                        - None
                        - Listed
                        - All
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: paths must be set when policy is Listed, and only then
                      rule: 'has(self.policy) && self.policy == ''Listed'' ? has(self.paths)
                        : !has(self.paths)'
                type: object
              patches:
                description: |-
                  patches defines base patches applied for every Order. Order patches
                  are merged on top, per target.
                items:
                  description: Patch defines a modification to apply to a resource
                  properties:
                    set:
                      additionalProperties:
                        type: string
                      description: |-
                        set contains JSONPath expressions and their values to set
                        Keys are JSONPath expressions (e.g., ".spec.replicas")
                        Values are the desired values for those paths
                      type: object
                    target:
                      description: target identifies which resource to patch
                      properties:
                        kind:
                          description: kind specifies the Kubernetes resource kind
                            to patch
                          type: string
                        name:
                          description: name specifies the name of the resource to
                            patch
                          type: string
                        namespace:
                          description: namespace specifies the namespace of the resource
                            (optional, defaults to same namespace as Order)
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                  required:
                  - set
                  - target
                  type: object
                type: array
              render:
                description: |-
                  render defines optional rendering configuration for the source artifact.
                  When absent the source is treated as a pre-rendered manifest bundle.
                  Orders cannot change the render type.
                properties:
                  helm:
                    description: |-
                      helm renders the source OCI artifact as a Helm chart.
                      When set, the source must be a Helm chart in OCI format.
                    properties:
                      includeCRDs:
                        default: false
                        description: |-
                          includeCRDs controls whether CRDs are included in the rendered output.
                          Equivalent to helm template --include-crds.
                        type: boolean
                      namespace:
                        description: |-
                          namespace is the target namespace passed to helm template --namespace.
                          Defaults to the Order's metadata.namespace when omitted.
                        type: string
                      releaseName:
                        description: |-
                          releaseName is the Helm release name passed to helm template.
                          Defaults to the Order's metadata.name when omitted.
                        type: string
                      values:
                        description: |-
                          values holds inline Helm values. On a Product they are the base values;
                          an Order's spec.values are deep-merged over them.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    type: object
                  manifest:
                    description: manifest configures rendering of a raw manifest bundle
                      source.
                    properties:
                      layout:
                        default: Single
                        description: |-
                          layout controls whether the artifact's YAML files are merged into a
                          single manifest.yaml (Single) or kept as separate files (Multi).
                          Artifacts containing a kustomization.yaml are never merged.
                        enum:
                        - Single
                        - Multi
                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: helm and manifest are mutually exclusive
                  rule: '!(has(self.helm) && has(self.manifest))'
              source:
                description: |-
                  source defines the OCI artifact the Product is built from. Orders
                  cannot change the source or version.
                properties:
                  oci:
                    description: |-
                      oci is the full OCI URL for the source manifests.
                      Mutually exclusive with pantryRef.
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid OCI URL
                      rule: self == '' || (isURL(self) && url(self).getScheme() ==
                        'oci')
                  pantryRef:
                    description: |-
                      pantryRef references a Pantry resource whose URL is used as the source.
                      Mutually exclusive with oci.
                    properties:
                      name:
                        description: name is the name of the Pantry resource.
                        type: string
                    required:
                    - name
                    type: object
                  verify:
                    description: |-
                      verify requires the artifact the version resolves to to carry a
                      trusted signature, by key or keyless against an expected signer
                      identity. A source that does not verify is not rendered.
                    properties:
                      matchOIDCIdentity:
                        description: |-
                          matchOIDCIdentity verifies keyless signatures whose certificate was
                          issued to one of the listed identities.
                        items:
                          description: |-
                            OIDCIdentityMatch matches the identity of a keyless signer. Both fields are
                            RE2 regular expressions and are not anchored.
                          properties:
                            issuer:
                              description: |-
                                issuer matches the OIDC issuer of the signer's certificate, for
                                example "^https://token\.actions\.githubusercontent\.com$".
                              maxLength: 1024
                              minLength: 1
                              type: string
                            subject:
                              description: |-
                                subject matches the subject of the signer's certificate, for example
                                the workflow that released the artifact.
                              maxLength: 1024
                              minLength: 1
                              type: string
                          required:
                          - issuer
                          - subject
                          type: object
                        maxItems: 16
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: atomic
                      provider:
                        default: cosign
                        description: provider is the signature format. Only "cosign"
                          is supported.
                        enum:
                        - cosign
                        type: string
                      secretRef:
                        description: |-
                          secretRef names a Secret in the Product's namespace holding public
                          keys. Every key whose name ends in ".pub" is tried; one verifying
                          signature suffices. Signatures are verified offline, without a
                          transparency log.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      trustedRootSecretRef:
                        description: |-
                          trustedRootSecretRef names a Secret in the Product's namespace whose
                          key "trusted_root.json" holds the Sigstore trusted root keyless
                          signatures are verified against. When unset, the Sigstore public-good
                          instance is used through TUF, which needs network access; set it in
                          air-gapped clusters.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of secretRef or matchOIDCIdentity must
                        be set
                      rule: has(self.secretRef) != has(self.matchOIDCIdentity)
                    - message: trustedRootSecretRef is only used with matchOIDCIdentity
                      rule: '!has(self.trustedRootSecretRef) || has(self.matchOIDCIdentity)'
                  version:
                    description: |-
                      version is the semantic version or tag of the artifact
                      The controller will resolve this to a digest
                    type: string
                required:
                - version
                type: object
                x-kubernetes-validations:
                - message: exactly one of oci or pantryRef must be set
                  rule: (has(self.oci) && !has(self.pantryRef)) || (!has(self.oci)
                    && has(self.pantryRef))
              vendor:
                description: |-
                  vendor optionally copies the source artifact to another OCI registry.
                  When set, Orders render from the vendored copy. When neither oci nor
                  pantryRef is set, the source is copied to
                  oci://<in-cluster registry>/<namespace>/vendor/<name>.
                properties:
                  oci:
                    description: |-
                      oci is the OCI registry URL the artifact is pushed to.
                      Mutually exclusive with pantryRef.
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid OCI URL
                      rule: self == '' || (isURL(self) && url(self).getScheme() ==
                        'oci')
                  pantryRef:
                    description: |-
                      pantryRef references a Pantry resource whose URL is used as the destination.
                      Mutually exclusive with oci.
                    properties:
                      name:
                        description: name is the name of the Pantry resource.
                        type: string
                    required:
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: oci and pantryRef are mutually exclusive
                  rule: '!(has(self.oci) && has(self.pantryRef))'
            required:
            - source
            type: object
          status:
            description: status defines the observed state of Product
            properties:
              conditions:
                description: conditions represent the current state of the Product
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configHash:
                description: |-
                  configHash is a SHA-256 hash of the source and vendor configuration
                  and the OCI URLs they resolved to. When it matches the current inputs
                  the published source is reused without resolving it again.
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              source:
                description: |-
                  source is the source address Orders render from. Absent until the
                  Product controller has resolved (and, if configured, vendored) the
                  source.
                properties:
                  digest:
                    description: |-
                      digest is the digest version resolved to. Orders render exactly this
                      artifact, so every variant of the Product renders the same source.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  oci:
                    description: oci is the full OCI URL of the source artifact.
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid OCI URL
                      rule: isURL(self) && url(self).getScheme() == 'oci'
                  pantryRef:
                    description: |-
                      pantryRef references the Pantry providing pull credentials for oci.
                      Absent when the registry is anonymously accessible.
                    properties:
                      name:
                        description: name is the name of the Pantry resource.
                        type: string
                    required:
                    - name
                    type: object
                  signatures:
                    description: |-
                      signatures lists every signature in the graph of the source: on the
                      source itself and on what is attached to it, such as an SBOM. Each is
                      verified against spec.source.verify, or against the keys the Kitchen
                      trusts when it is not set. Only verified is a decision; signatures is
                      the evidence.
                    items:
                      description: |-
                        SignatureVerdict is the result of verifying one signature in the graph of
                        a source.
                      properties:
                        digest:
                          description: |-
                            digest is the digest of the signature: a Sigstore bundle referrer, a
                            legacy cosign signature manifest, or a signature in another format.
                          pattern: ^sha256:[a-f0-9]{64}$
                          type: string
                        message:
                          description: message says why the signature did not verify.
                          maxLength: 1024
                          type: string
                        result:
                          description: result is the result of the verification.
                          enum:
                          - Verified
                          - UntrustedSigner
                          - Invalid
                          - Unsupported
                          type: string
                        signer:
                          description: |-
                            signer identifies whose signature verified. Set only when result is
                            Verified.
                          properties:
                            issuer:
                              description: issuer is the OIDC issuer of the keyless
                                signer's certificate.
                              maxLength: 2048
                              type: string
                            keyID:
                              description: |-
                                keyID identifies the public key that verified the signature: the
                                base64-encoded SHA-256 of its DER encoding. Set for key-based
                                verification.
                              maxLength: 64
                              type: string
                            provider:
                              description: provider is the signature format that verified.
                              enum:
                              - cosign
                              type: string
                            subject:
                              description: subject is the subject of the keyless signer's
                                certificate.
                              maxLength: 2048
                              type: string
                          required:
                          - provider
                          type: object
                        subject:
                          description: subject is the digest of the manifest the signature
                            signs.
                          pattern: ^sha256:[a-f0-9]{64}$
                          type: string
                      required:
                      - digest
                      - result
                      - subject
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - digest
                    x-kubernetes-list-type: map
                  signaturesCheckedTime:
                    description: |-
                      signaturesCheckedTime is when signatures was last checked. It is
                      refreshed when the signatures change, and otherwise at most once an
                      hour.
                    format: date-time
                    type: string
                  verified:
                    description: |-
                      verified records who signed the source, when its signature verified:
                      through spec.source.verify, or by a key the Kitchen trusts. Absent
                      when the source was not verified.
                    properties:
                      issuer:
                        description: issuer is the OIDC issuer of the keyless signer's
                          certificate.
                        maxLength: 2048
                        type: string
                      keyID:
                        description: |-
                          keyID identifies the public key that verified the signature: the
                          base64-encoded SHA-256 of its DER encoding. Set for key-based
                          verification.
                        maxLength: 64
                        type: string
                      provider:
                        description: provider is the signature format that verified.
                        enum:
                        - cosign
                        type: string
                      subject:
                        description: subject is the subject of the keyless signer's
                          certificate.
                        maxLength: 2048
                        type: string
                    required:
                    - provider
                    type: object
                  version:
                    description: version is the tag of the source artifact.
                    minLength: 1
                    type: string
                required:
                - digest
                - oci
                - version
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
