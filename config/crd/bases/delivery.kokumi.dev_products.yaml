---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: products.delivery.kokumi.dev
spec:
  group: delivery.kokumi.dev
  names:
    kind: Product
    listKind: ProductList
    plural: products
    singular: product
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .spec.source.url
      name: Source
      type: string
    - jsonPath: .spec.source.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=='SourceVerified')].status
      name: Verified
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Product is the Schema for the products API.
          A Product defines an application completely; Orders in the same namespace
          reference it and add their own values, patches, and promotion settings.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Product
            properties:
              images:
                default: {}
                description: |-
                  images configures how the container images the rendered manifests
                  reference are recorded, pinned or vendored. It applies to every Order
                  of the Product.
                properties:
                  fieldSpecs:
                    description: |-
                      fieldSpecs lists the fields of custom resources that hold image
                      references, in addition to the containers, initContainers,
                      ephemeralContainers and image volumes of every Pod template.
                    items:
                      description: |-
                        ImageFieldSpec locates a field that holds a container image reference, in
                        the shape of a kustomize FieldSpec.
                      properties:
                        group:
                          description: |-
                            group is the API group of the resources. Empty matches the core group
                            and every other group.
                          maxLength: 253
                          type: string
                        kind:
                          description: kind is the kind of the resources, for example
                            "Prometheus".
                          maxLength: 63
                          minLength: 1
                          type: string
                        path:
                          description: |-
                            path is the slash-separated path to the field, with [] for every
                            element of a list, for example "spec/image" or
                            "spec/sidecars[]/image".
                          maxLength: 256
                          minLength: 1
                          type: string
                        version:
                          description: |-
                            version is the API version of the resources. Empty matches every
                            version.
                          maxLength: 63
                          type: string
                      required:
                      - kind
                      - path
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: atomic
                  policy:
                    default: Record
                    description: |-
                      policy controls what Kokumi does with the images: Record lists them by
                      digest, Pin also rewrites the manifests to those digests, and Vendor
                      copies each image into a repository of its own below the Product's
                      vendor location, <vendor url>/images/<image name>, and rewrites the
                      manifests to pull them from there. Vendor requires spec.vendor.
                    enum:
                    - Record
                    - Pin
                    - Vendor
                    type: string
                type: object
              overrides:
                default: {}
                description: |-
                  overrides controls what Orders may change. By default Orders may not
                  set any Helm values, patches, or edits.
                properties:
                  patches:
                    default: {}
                    description: patches controls which patches and edits Orders may
                      set.
                    properties:
                      policy:
                        default: None
                        description: |-
                          policy controls which patches and edits Orders may set.
                          None: Orders may not set any patches or edits.
                          Listed: Orders may patch and edit only the paths listed in targets.
                          All: Orders may patch and edit anything.
                        enum:
                        - None
                        - Listed
                        - All
                        type: string
                      targets:
                        description: |-
                          targets lists the patch targets and paths that Orders may patch or
                          edit. Only used when policy is Listed.
                        items:
                          description: AllowedPatchTarget defines which patch target
                            and JSON paths Orders may use.
                          properties:
                            paths:
                              description: |-
                                paths lists the allowed JSONPath expressions within the target
                                (e.g. ".spec.replicas").
                              items:
                                maxLength: 1024
                                minLength: 1
                                type: string
                              maxItems: 64
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: set
                            target:
                              description: |-
                                target identifies the resource that Orders may patch. A target without
                                a namespace matches the resource in any namespace.
                              properties:
                                kind:
                                  description: kind specifies the Kubernetes resource
                                    kind to patch
                                  type: string
                                name:
                                  description: name specifies the name of the resource
                                    to patch
                                  type: string
                                namespace:
                                  description: namespace specifies the namespace of
                                    the resource (optional, defaults to same namespace
                                    as Order)
                                  type: string
                              required:
                              - kind
                              - name
                              type: object
                          required:
                          - paths
                          - target
                          type: object
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                    x-kubernetes-validations:
                    - message: targets must be set when policy is Listed, and only
                        then
                      rule: 'has(self.policy) && self.policy == ''Listed'' ? has(self.targets)
                        : !has(self.targets)'
                  values:
                    default: {}
                    description: values controls which Helm values Orders may set.
                    properties:
                      paths:
                        description: |-
                          paths lists the dot-separated Helm value paths that Orders may set
                          (e.g. "ui.message", "replicaCount"). Only used when policy is Listed.
                        items:
                          type: string
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                      policy:
                        default: None
                        description: |-
                          policy controls which Helm values Orders may set.
                          None: Orders may not set any values.
                          Listed: Orders may set only the values listed in paths.
                          All: Orders may set any value.
                        enum:
                        - None
                        - Listed
                        - All
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: paths must be set when policy is Listed, and only then
                      rule: 'has(self.policy) && self.policy == ''Listed'' ? has(self.paths)
                        : !has(self.paths)'
                type: object
              patches:
                description: |-
                  patches defines base patches applied for every Order. Order patches
                  are merged on top, per target.
                items:
                  description: Patch defines a modification to apply to a resource
                  properties:
                    set:
                      additionalProperties:
                        type: string
                      description: |-
                        set contains JSONPath expressions and their values to set
                        Keys are JSONPath expressions (e.g., ".spec.replicas")
                        Values are the desired values for those paths
                      type: object
                    target:
                      description: target identifies which resource to patch
                      properties:
                        kind:
                          description: kind specifies the Kubernetes resource kind
                            to patch
                          type: string
                        name:
                          description: name specifies the name of the resource to
                            patch
                          type: string
                        namespace:
                          description: namespace specifies the namespace of the resource
                            (optional, defaults to same namespace as Order)
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                  required:
                  - set
                  - target
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-type: atomic
              registryRefs:
                description: |-
                  registryRefs lists Registries in the Product's namespace. Kokumi
                  connects to the Product's source, the registries of its images and
                  their mirrors, and its vendor location through the one whose url
                  covers each, the longest when several do. Orders connect to their
                  destination through their own registryRefs.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              render:
                description: |-
                  render defines optional rendering configuration for the source artifact.
                  When absent the source is treated as a pre-rendered manifest bundle.
                  Orders cannot change the render type.
                properties:
                  helm:
                    description: |-
                      helm renders the source OCI artifact as a Helm chart.
                      When set, the source must be a Helm chart in OCI format.
                    properties:
                      includeCRDs:
                        default: false
                        description: |-
                          includeCRDs controls whether CRDs are included in the rendered output.
                          Equivalent to helm template --include-crds.
                        type: boolean
                      namespace:
                        description: |-
                          namespace is the target namespace passed to helm template --namespace.
                          Defaults to the Order's metadata.namespace when omitted.
                        type: string
                      releaseName:
                        description: |-
                          releaseName is the Helm release name passed to helm template.
                          Defaults to the Order's metadata.name when omitted.
                        type: string
                      values:
                        description: |-
                          values holds inline Helm values. On a Product they are the base values;
                          an Order's spec.values are deep-merged over them.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    type: object
                  manifest:
                    description: manifest configures rendering of a raw manifest bundle
                      source.
                    properties:
                      layout:
                        default: Single
                        description: |-
                          layout controls whether the artifact's YAML files are merged into a
                          single manifest.yaml (Single) or kept as separate files (Multi).
                          Artifacts containing a kustomization.yaml are never merged.
                        enum:
                        - Single
                        - Multi
                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: helm and manifest are mutually exclusive
                  rule: '!(has(self.helm) && has(self.manifest))'
              source:
                description: |-
                  source defines the OCI artifact the Product is built from. Orders
                  cannot change the source or version.
                properties:
                  url:
                    description: |-
                      url is the oci:// URL of the repository of the source artifact. The
                      Product connects to it through the Registry among its registryRefs
                      that covers it.
                    maxLength: 2048
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid OCI URL
                      rule: isURL(self) && url(self).getScheme() == 'oci'
                  verify:
                    description: |-
                      verify requires the artifact the version resolves to to carry a
                      trusted signature, by key or keyless against an expected signer
                      identity. A source that does not verify is not rendered.
                    properties:
                      matchOIDCIdentity:
                        description: |-
                          matchOIDCIdentity verifies keyless signatures whose certificate was
                          issued to one of the listed identities.
                        items:
                          description: |-
                            OIDCIdentityMatch matches the identity of a keyless signer. Both fields are
                            RE2 regular expressions and are not anchored.
                          properties:
                            issuer:
                              description: |-
                                issuer matches the OIDC issuer of the signer's certificate, for
                                example "^https://token\.actions\.githubusercontent\.com$".
                              maxLength: 1024
                              minLength: 1
                              type: string
                            subject:
                              description: |-
                                subject matches the subject of the signer's certificate, for example
                                the workflow that released the artifact.
                              maxLength: 1024
                              minLength: 1
                              type: string
                          required:
                          - issuer
                          - subject
                          type: object
                        maxItems: 16
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: atomic
                      provider:
                        default: cosign
                        description: provider is the signature format. Only "cosign"
                          is supported.
                        enum:
                        - cosign
                        type: string
                      secretRef:
                        description: |-
                          secretRef names a Secret in the Product's namespace holding public
                          keys. Every key whose name ends in ".pub" is tried; one verifying
                          signature suffices. Signatures are verified offline, without a
                          transparency log.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      trustedRootSecretRef:
                        description: |-
                          trustedRootSecretRef names a Secret in the Product's namespace whose
                          key "trusted_root.json" holds the Sigstore trusted root keyless
                          signatures are verified against. When unset, the Sigstore public-good
                          instance is used through TUF, which needs network access; set it in
                          air-gapped clusters.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of secretRef or matchOIDCIdentity must
                        be set
                      rule: has(self.secretRef) != has(self.matchOIDCIdentity)
                    - message: trustedRootSecretRef is only used with matchOIDCIdentity
                      rule: '!has(self.trustedRootSecretRef) || has(self.matchOIDCIdentity)'
                  version:
                    description: |-
                      version is the semantic version or tag of the artifact
                      The controller will resolve this to a digest
                    type: string
                required:
                - url
                - version
                type: object
              vendor:
                description: |-
                  vendor optionally copies the source artifact to another OCI
                  repository, and under the Vendor image policy also the images, below
                  it at <url>/images. When set, Orders render from the vendored copy.
                  Without a url, the source is copied to
                  oci://<in-cluster registry>/<namespace>/vendor/<name>. A source read
                  with credentials is only copied where a Registry with credentials
                  connects to.
                properties:
                  url:
                    description: |-
                      url is the oci:// URL of the repository the artifact is pushed to.
                      When omitted, a repository of the bundled registry is used.
                    maxLength: 2048
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid OCI URL
                      rule: isURL(self) && url(self).getScheme() == 'oci'
                type: object
            required:
            - source
            type: object
            x-kubernetes-validations:
            - message: the Vendor image policy needs spec.vendor, the location the
                images are copied below
              rule: '!has(self.images) || !has(self.images.policy) || self.images.policy
                != ''Vendor'' || has(self.vendor)'
          status:
            description: status defines the observed state of Product
            properties:
              conditions:
                description: conditions represent the current state of the Product
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configHash:
                description: |-
                  configHash is a SHA-256 hash of the source and vendor configuration
                  and the OCI URLs they resolved to. When it matches the current inputs
                  the published source is reused without resolving it again.
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              registryAccess:
                description: |-
                  registryAccess lists the registry locations the Product needs: its
                  source and its vendor location, and the Registry Kokumi connects to
                  each through. The images belong to the render of each Order and are
                  listed on the Orders.
                items:
                  description: |-
                    RegistryAccess is a registry location a Product or an Order needs, who
                    accesses it, and the Registry that authenticates Kokumi there. Kokumi
                    gives no credentials to Argo CD and the kubelet: they need their own for
                    the locations reported for them.
                  properties:
                    client:
                      description: client is who accesses the location.
                      enum:
                      - Kokumi
                      - ArgoCD
                      - Kubelet
                      type: string
                    operation:
                      description: operation is what client does there.
                      enum:
                      - Pull
                      - Push
                      type: string
                    registry:
                      description: |-
                        registry names the Registry whose connection Kokumi uses there. It is
                        empty when Kokumi accesses the location anonymously, and for the
                        other clients.
                      maxLength: 253
                      type: string
                    url:
                      description: url is the location, or the prefix of the locations,
                        accessed.
                      maxLength: 2048
                      type: string
                  required:
                  - client
                  - operation
                  - url
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - url
                - operation
                - client
                x-kubernetes-list-type: map
              source:
                description: |-
                  source is the source address Orders render from. Absent until the
                  Product controller has resolved (and, if configured, vendored) the
                  source.
                properties:
                  digest:
                    description: |-
                      digest is the digest version resolved to. Orders render exactly this
                      artifact, so every variant of the Product renders the same source.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  signatures:
                    description: |-
                      signatures lists every signature in the graph of the source: on the
                      source itself and on what is attached to it, such as an SBOM. Each is
                      verified against spec.source.verify, or against the keys the Kitchen
                      trusts when it is not set. Only verified is a decision; signatures is
                      the evidence.
                    items:
                      description: |-
                        SignatureVerdict is the result of verifying one signature in the graph of
                        a source.
                      properties:
                        digest:
                          description: |-
                            digest is the digest of the signature: a Sigstore bundle referrer, a
                            legacy cosign signature manifest, or a signature in another format.
                          pattern: ^sha256:[a-f0-9]{64}$
                          type: string
                        message:
                          description: message says why the signature did not verify.
                          maxLength: 1024
                          type: string
                        result:
                          description: result is the result of the verification.
                          enum:
                          - Verified
                          - UntrustedSigner
                          - Invalid
                          - Unsupported
                          type: string
                        signer:
                          description: |-
                            signer identifies whose signature verified. Set only when result is
                            Verified.
                          properties:
                            issuer:
                              description: issuer is the OIDC issuer of the keyless
                                signer's certificate.
                              maxLength: 2048
                              type: string
                            keyID:
                              description: |-
                                keyID identifies the public key that verified the signature: the
                                base64-encoded SHA-256 of its DER encoding. Set for key-based
                                verification.
                              maxLength: 64
                              type: string
                            provider:
                              description: provider is the signature format that verified.
                              enum:
                              - cosign
                              type: string
                            subject:
                              description: subject is the subject of the keyless signer's
                                certificate.
                              maxLength: 2048
                              type: string
                          required:
                          - provider
                          type: object
                        subject:
                          description: subject is the digest of the manifest the signature
                            signs.
                          pattern: ^sha256:[a-f0-9]{64}$
                          type: string
                      required:
                      - digest
                      - result
                      - subject
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - digest
                    x-kubernetes-list-type: map
                  signaturesCheckedTime:
                    description: |-
                      signaturesCheckedTime is when signatures was last checked. It is
                      refreshed when the signatures change, and otherwise at most once an
                      hour.
                    format: date-time
                    type: string
                  url:
                    description: |-
                      url is the oci:// URL of the repository of the source artifact: of
                      the vendored copy when the Product vendors.
                    maxLength: 2048
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid OCI URL
                      rule: isURL(self) && url(self).getScheme() == 'oci'
                  verified:
                    description: |-
                      verified records who signed the source, when its signature verified:
                      through spec.source.verify, or by a key the Kitchen trusts. Absent
                      when the source was not verified.
                    properties:
                      issuer:
                        description: issuer is the OIDC issuer of the keyless signer's
                          certificate.
                        maxLength: 2048
                        type: string
                      keyID:
                        description: |-
                          keyID identifies the public key that verified the signature: the
                          base64-encoded SHA-256 of its DER encoding. Set for key-based
                          verification.
                        maxLength: 64
                        type: string
                      provider:
                        description: provider is the signature format that verified.
                        enum:
                        - cosign
                        type: string
                      subject:
                        description: subject is the subject of the keyless signer's
                          certificate.
                        maxLength: 2048
                        type: string
                    required:
                    - provider
                    type: object
                  version:
                    description: version is the tag of the source artifact.
                    minLength: 1
                    type: string
                required:
                - digest
                - url
                - version
                type: object
              vulnerabilities:
                description: |-
                  vulnerabilities summarizes the latest scans of the images the
                  Product vendors and its Orders' Preparations in use run. The signed
                  reports are referrers of the vendored images; this summary is for
                  display. Set while the Kitchen enables scanning and the Product's
                  image policy is Vendor.
                properties:
                  images:
                    description: |-
                      images lists the latest scan of each vendored image digest in use.
                      When more digests are in use, the most recently scanned are listed
                      and the Scanned condition says how many were left out.
                    items:
                      description: ImageScan is the latest scan of one vendored image
                        digest.
                      properties:
                        digest:
                          description: |-
                            digest is the digest of the vendored image, an image index or
                            manifest.
                          pattern: ^sha256:[a-f0-9]{64}$
                          type: string
                        platform:
                          description: |-
                            platform is the platform of the image index that was scanned, such
                            as "linux/amd64". Empty for a single-platform image.
                          maxLength: 64
                          type: string
                        report:
                          description: |-
                            report is the digest of the signed vulnerability report, a referrer
                            of the vendored image.
                          pattern: ^sha256:[a-f0-9]{64}$
                          type: string
                        repository:
                          description: repository is the oci:// URL of the vendored
                            image's repository.
                          maxLength: 2048
                          type: string
                        sbom:
                          description: sbom is the SBOM the scan was computed from.
                          properties:
                            digest:
                              description: |-
                                digest is the digest of the referrer or attestation manifest holding
                                the SBOM.
                              pattern: ^sha256:[a-f0-9]{64}$
                              type: string
                            origin:
                              description: origin says where the SBOM came from.
                              enum:
                              - Generated
                              - Image
                              - Signed
                              type: string
                          required:
                          - digest
                          - origin
                          type: object
                        scannedTime:
                          description: scannedTime is when the image was scanned.
                          format: date-time
                          type: string
                        summary:
                          description: summary counts the findings of the report.
                          properties:
                            critical:
                              description: critical counts the findings of severity
                                Critical.
                              format: int32
                              minimum: 0
