---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: preparations.delivery.kokumi.dev
spec:
  group: delivery.kokumi.dev
  names:
    kind: Preparation
    listKind: PreparationList
    plural: preparations
    shortNames:
    - prep
    singular: preparation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.orderName
      name: Order
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=='Approved')].reason
      name: Approved
      type: string
    - jsonPath: .spec.artifact.digest
      name: Digest
      priority: 1
      type: string
    - jsonPath: .spec.artifact.signed
      name: Signed
      priority: 1
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Preparation is the Schema for the preparations API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Preparation
            properties:
              approvalPolicy:
                description: |-
                  approvalPolicy is the approval gate copied from the Order when this
                  Preparation was created. When set, the Preparation is only served once
                  the policy is satisfied. It is also recorded on the OCI artifact.
                properties:
                  allowedGroups:
                    description: allowedGroups lists the groups whose members are
                      eligible to approve.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  requiredApprovals:
                    description: requiredApprovals is the minimum number of distinct
                      eligible approvers.
                    format: int32
                    maximum: 32
                    minimum: 1
                    type: integer
                required:
                - allowedGroups
                - requiredApprovals
                type: object
              artifact:
                description: artifact defines the output artifact information
                properties:
                  digest:
                    description: digest is the SHA256 digest of the artifact
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  ociRef:
                    description: ociRef is the full OCI reference including digest
                    maxLength: 2048
                    pattern: ^oci://.*@sha256:[a-f0-9]{64}$
                    type: string
                  signed:
                    description: signed indicates whether the artifact has been cryptographically
                      signed
                    type: boolean
                required:
                - digest
                - ociRef
                type: object
              commitMessage:
                description: |-
                  commitMessage is the human-readable description of why this Preparation was created.
                  It is stored as the org.opencontainers.image.description annotation on the OCI artifact.
                maxLength: 512
                type: string
              configHash:
                description: configHash is the SHA256 hash of the canonicalized order
                  configuration
                maxLength: 71
                pattern: ^sha256:[a-f0-9]+$
                type: string
              gitSource:
                description: |-
                  gitSource records the SCM provenance of the base artifact that produced
                  this Preparation. Empty when the base artifact carries no git provenance.
                properties:
                  commitHash:
                    description: |-
                      commitHash is the SCM commit SHA of the base artifact's source files
                      (org.opencontainers.image.revision). Empty when the base artifact carries
                      no git revision.
                    maxLength: 64
                    type: string
                  repo:
                    description: |-
                      repo is the SCM repository URL of the base artifact's source
                      (org.opencontainers.image.source). Empty when the base artifact carries
                      no git provenance.
                    maxLength: 2048
                    type: string
                  tag:
                    description: |-
                      tag is the SCM tag of the base artifact's source files
                      (org.opencontainers.image.version). Empty when the base artifact carries
                      no git tag.
                    maxLength: 256
                    type: string
                type: object
              orderName:
                description: orderName is the name of the Order this preparation belongs
                  to
                maxLength: 253
                type: string
              parentDigest:
                description: |-
                  parentDigest is the SHA256 digest of the artifact produced by the immediately preceding
                  Preparation for this Order. It is empty for the first Preparation and is stored as the
                  kokumi.dev/parent annotation on the OCI artifact, forming a git-like revision chain.
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              renderer:
                description: renderer defines the renderer used to process this preparation
                properties:
                  digest:
                    description: digest is the SHA256 digest of the renderer binary/image
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  renderType:
                    description: |-
                      renderType records how the source was rendered to produce this Preparation.
                      One of "Manifest" or "Helm".
                    enum:
                    - Manifest
                    - Helm
                    maxLength: 8
                    type: string
                  version:
                    description: version is the semantic version of the renderer
                    maxLength: 64
                    type: string
                required:
                - digest
                - renderType
                - version
                type: object
              source:
                description: source defines the source artifact information
                properties:
                  baseDigest:
                    description: baseDigest is the SHA256 digest of the base source
                      artifact
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  oci:
                    description: oci is the OCI registry URL for the source manifests
                    maxLength: 2048
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid OCI URL
                      rule: isURL(self) && url(self).getScheme() == 'oci'
                required:
                - baseDigest
                - oci
                type: object
            required:
            - artifact
            - configHash
            - orderName
            - renderer
            - source
            type: object
            x-kubernetes-validations:
            - message: Preparation spec is immutable
              rule: self == oldSelf
          status:
            description: status defines the observed state of Preparation
            properties:
              approval:
                description: |-
                  approval aggregates the Approvals of this Preparation. Only set when
                  spec.approvalPolicy is set.
                properties:
                  approvedCount:
                    description: approvedCount is the number of eligible approvers
                      whose latest vote is Approve.
                    format: int32
                    type: integer
                  attestation:
                    description: attestation references the OCI artifact recording
                      the sealed votes.
                    properties:
                      digest:
                        description: digest is the manifest digest of the attestation.
                        maxLength: 71
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                      ociRef:
                        description: ociRef is the full OCI reference of the attestation
                          including digest.
                        maxLength: 2048
                        type: string
                    required:
                    - digest
                    - ociRef
                    type: object
                  ineligibleCount:
                    description: ineligibleCount is the number of approvers not in
                      any allowed group.
                    format: int32
                    type: integer
                  rejectedCount:
                    description: rejectedCount is the number of eligible approvers
                      whose latest vote is Reject.
                    format: int32
                    type: integer
                  requiredApprovals:
                    description: requiredApprovals is the number of approvals required
                      by the policy.
                    format: int32
                    type: integer
                  sealedTime:
                    description: |-
                      sealedTime is when the votes were locked because the Preparation was
                      promoted. Votes submitted afterwards are ignored.
                    format: date-time
                    type: string
                  submissionCount:
                    description: |-
                      submissionCount is the total number of Approvals for this Preparation,
                      including superseded ones.
                    format: int32
                    type: integer
                  votes:
                    description: |-
                      votes lists the latest vote of each approver. Once sealed, only these
                      votes are considered.
                    items:
                      description: ApprovalVote is the latest vote of a single approver
                        on a Preparation.
                      properties:
                        approvalName:
                          description: approvalName is the name of the Approval carrying
                            this vote.
                          maxLength: 253
                          type: string
                        decision:
                          description: decision is the verdict of the vote.
                          enum:
                          - Approve
                          - Reject
                          type: string
                        issuer:
                          description: issuer is the OIDC issuer of the approver.
                          maxLength: 2048
                          type: string
                        result:
                          description: result reports whether the vote counts towards
                            the gate.
                          enum:
                          - Counted
                          - NotEligible
                          type: string
                        subject:
                          description: subject is the OIDC subject of the approver.
                          maxLength: 255
                          type: string
                        submittedTime:
                          description: submittedTime is when the vote was submitted.
                          format: date-time
                          type: string
                        username:
                          description: username is the human-readable name of the
                            approver.
                          maxLength: 253
                          type: string
                      required:
                      - approvalName
                      - decision
                      - issuer
                      - result
                      - subject
                      - submittedTime
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              conditions:
                description: conditions represent the current state of the Preparation
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.orderName
    served: true
    storage: true
    subresources:
      status: {}
