---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: environments.delivery.kokumi.dev
spec:
  group: delivery.kokumi.dev
  names:
    categories:
    - kokumi
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    shortNames:
    - env
    singular: environment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deployer.type
      name: Deployer
      type: string
    - jsonPath: .spec.deployer.argoCD.project
      name: Project
      type: string
    - jsonPath: .status.clusters.selected
      name: Clusters
      type: integer
    - jsonPath: .status.clusters.ready
      name: Ready Clusters
      priority: 1
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Environment is a group of clusters for the Orders of its namespace to
          deploy to. It selects the Clusters of its namespace by their labels, and
          names the engine that deploys there.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Environment
            properties:
              clusterSelector:
                description: |-
                  clusterSelector selects the Clusters of the Environment's namespace by
                  their labels. {} selects every Cluster of the namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              deployer:
                description: deployer is the engine that deploys to the Environment's
                  clusters.
                properties:
                  argoCD:
                    description: argoCD configures the Argo CD Applications of the
                      Environment.
                    properties:
                      project:
                        description: |-
                          project is the Argo CD AppProject, in the argocd namespace, of every
                          Application that deploys to the Environment. Outside Kokumi's own
                          namespace, its sourceNamespaces must admit the Environment's
                          namespace; its destinations decide which servers and target
                          namespaces Orders may deploy to.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - project
                    type: object
                  type:
                    description: 'type is the engine: ArgoCD.'
                    enum:
                    - ArgoCD
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: argoCD is required when type is ArgoCD, and forbidden otherwise
                  rule: 'self.type == ''ArgoCD'' ? has(self.argoCD) : !has(self.argoCD)'
              description:
                description: description says what the Environment is for.
                maxLength: 1024
                type: string
            required:
            - clusterSelector
            - deployer
            type: object
          status:
            description: status defines the observed state of Environment
            properties:
              clusters:
                description: clusters counts the Clusters the Environment selects.
                properties:
                  ready:
                    description: ready is how many of them are Ready.
                    format: int32
                    minimum: 0
                    type: integer
                  selected:
                    description: |-
                      selected is how many Clusters of the namespace the clusterSelector
                      selects.
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - ready
                - selected
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the Environment. Ready
                  reports whether it selects any Cluster and its engine admits it; each
                  Cluster reports its own readiness.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
