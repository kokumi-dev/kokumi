---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusters.delivery.kokumi.dev
spec:
  group: delivery.kokumi.dev
  names:
    categories:
    - kokumi
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    shortNames:
    - kcl
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.connection
      name: Connection
      type: string
    - jsonPath: .status.server
      name: Server
      type: string
    - jsonPath: .status.kubernetesVersion
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster is a cluster for Orders to deploy to, and how Kokumi reaches it.
          Kokumi reports whether it is reachable and accepts the credential.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Cluster
            properties:
              connection:
                description: |-
                  connection is how the cluster is reached: InCluster, the cluster
                  Kokumi runs in, or Kubeconfig, the kubeconfig in a Secret.
                enum:
                - InCluster
                - Kubeconfig
                type: string
              description:
                description: |-
                  description says what the cluster is, such as where it runs and who
                  runs it.
                maxLength: 1024
                type: string
              kubeconfig:
                description: kubeconfig names the Secret that holds the cluster's
                  kubeconfig.
                properties:
                  secretRef:
                    description: |-
                      secretRef names the Secret, in the Cluster's namespace, and its key
                      that hold a self-contained kubeconfig: the server of its current
                      context with its CA, and a token or a client certificate and key,
                      inline. Exec plugins, auth providers and file references are not
                      supported.
                    properties:
                      key:
                        default: value
                        description: |-
                          key is the key of the kubeconfig in the Secret: value by default, as
                          Cluster API names it.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
            required:
            - connection
            type: object
            x-kubernetes-validations:
            - message: kubeconfig is required when connection is Kubeconfig, and forbidden
                otherwise
              rule: 'self.connection == ''Kubeconfig'' ? has(self.kubeconfig) : !has(self.kubeconfig)'
          status:
            description: status defines the observed state of Cluster
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Cluster. Ready reports
                  whether Kokumi reaches it: its kubeconfig is usable, its control plane
                  is ready, and it accepts the credential.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              kubernetesVersion:
                description: |-
                  kubernetesVersion is the Kubernetes version the cluster's API server
                  reports.
                maxLength: 64
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              server:
                description: server is the URL of the cluster's API server.
                maxLength: 2048
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'the name of a Cluster is at most 63 characters: it is a label
            value of what deploys there'
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
