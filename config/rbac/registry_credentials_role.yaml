---
# Registry credentials are docker-registry Secrets in the Registry's
# namespace. The UI stores them, and reads through a Registry with the
# user's identity: browsing a private repository, a Product's source or a
# Preparation needs get on the Registry's Secret. The admission policy
# registry-secret-access also requires it to name a Secret in a Registry.
# The built-in admin and editor roles hold no Secret access, because they
# are bound cluster-wide and the signing key is a Secret. Platform admins
# grant Registry credentials per tenant namespace:
#
#   kubectl -n team-a create rolebinding kokumi-registry-credentials \
#     --clusterrole=kokumi-registry-credentials \
#     --serviceaccount=kokumi:kokumi-editor
#
# Never bind it with a ClusterRoleBinding, in the kokumi-signing namespace
# (the signing key), or in the install namespace (the session token signing
# key and the login Secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: registry-credentials
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - patch
