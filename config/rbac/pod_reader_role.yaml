---
# Namespaced Pod read access for the controller manager. At start-up the
# manager reads its own Pod to learn the image it runs from, which it records
# as the builder of every artifact it renders.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-manager-pod-reader
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-manager-pod-reader
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller-manager-pod-reader
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
