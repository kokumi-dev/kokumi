---
# A Cluster reached with a kubeconfig names a Secret in its namespace that
# holds the kubeconfig. The UI stores it as the signed-in user, and the
# admission policy kokumi-cluster-secret-access requires get on the Secret a Cluster
# names. The built-in admin role holds no Secret access, because it is bound
# cluster-wide and the signing key is a Secret. Platform admins grant cluster
# credentials per namespace that holds Clusters:
#
#   kubectl -n platform create rolebinding kokumi-cluster-credentials \
#     --clusterrole=kokumi-cluster-credentials \
#     --serviceaccount=kokumi:kokumi-admin
#
# Never bind it with a ClusterRoleBinding, in the kokumi-signing namespace
# (the signing key), or in the install namespace (the session token signing
# key and the login Secrets). The Cluster in-cluster that Kokumi keeps in the
# install namespace needs no Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-credentials
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - patch
