---
# Pantry credentials are docker-registry Secrets in the Pantry's namespace.
# The UI stores them, and previews of Pantry-backed sources read them, with
# the user's identity. The built-in admin and editor roles hold no Secret
# access, because they are bound cluster-wide and the signing key is a
# Secret. Platform admins grant Pantry credentials per tenant namespace:
#
#   kubectl -n team-a create rolebinding kokumi-pantry-credentials \
#     --clusterrole=kokumi-pantry-credentials \
#     --serviceaccount=kokumi:kokumi-editor
#
# Never bind it with a ClusterRoleBinding, in the kokumi-signing namespace
# (the signing key), or in the install namespace (the session token signing
# key and the login Secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pantry-credentials
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - patch
