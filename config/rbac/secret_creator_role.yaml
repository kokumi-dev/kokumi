---
# Namespaced secret creation for the controller manager. The Kitchen controller
# is the only component that creates Secrets (the kokumi-server-tokens signing
# key), always in the install namespace, so the cluster-wide role.yaml keeps
# get/list/watch only and this Role narrows creation to the install namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-manager-secret-creator
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-manager-secret-creator
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller-manager-secret-creator
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
