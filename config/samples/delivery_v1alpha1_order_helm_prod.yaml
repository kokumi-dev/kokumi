apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: podinfo-prod
spec:
  productRef:
    name: podinfo

  values:
    ui:
      message: "Hello from production"
    replicaCount: 3

  destination:
    url: oci://kokumi-registry.kokumi.svc.cluster.local:5000/preparation/podinfo-prod

  # A Product revision deploys here once podinfo-staging ran its own
  # Preparation of it healthily for five minutes, and two release approvers
  # approved it.
  promotion:
    mode: Manual
    after:
    - order: podinfo-staging
      soakSeconds: 300
    approvals:
      requiredApprovals: 2
      allowedGroups:
      - release-approvers
