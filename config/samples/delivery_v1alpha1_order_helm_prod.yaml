apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: podinfo-prod
spec:
  productRef:
    name: podinfo

  values:
    ui:
      message: "Hello from production"
    replicaCount: 3

  destination:
    oci: oci://kokumi-registry.kokumi.svc.cluster.local:5000/preparation/podinfo-prod

  # Each Preparation needs two release approvers before it can be served.
  promotion:
    mode: Manual
    approvals:
      requiredApprovals: 2
      allowedGroups:
      - release-approvers
