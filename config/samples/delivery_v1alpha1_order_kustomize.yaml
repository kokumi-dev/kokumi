apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: podinfo-kustomize
spec:
  productRef:
    name: podinfo-kustomize

  patches:
    - target:
        kind: Deployment
        name: podinfo
      set:
        .spec.replicas: "2"

  destination:
    url: oci://kokumi-registry.kokumi.svc.cluster.local:5000/preparation/podinfo-kustomize

  promotion:
    mode: Manual
