# The public key the testdata is signed with (hack/testdata/cosign.pub).
# "make push-artifacts" pushes and signs the testdata to the in-cluster
# registry.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: testdata-signing-key
stringData:
  cosign.pub: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEf5kP1pt27xjmSdBXIWM9cWzKKdbo
    6er7IMdhMPWy3rUtdaEdxt4paHt2DPMhPxJY9cjJXsxB9hHtZS7AYfR/aw==
    -----END PUBLIC KEY-----
---
apiVersion: delivery.kokumi.dev/v1alpha1
kind: Product
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: external-secrets-verified
spec:
  source:
    url: oci://kokumi-registry.kokumi.svc.cluster.local:5000/kokumi-dev/testdata/external-secrets
    version: "0.1.0"
    # Orders render the source only once its signature verifies against a key
    # in the Secret. A keyless source names the expected signer instead:
    #
    #   verify:
    #     matchOIDCIdentity:
    #     - issuer: ^https://token\.actions\.githubusercontent\.com$
    #       subject: ^https://github\.com/stefanprodan/podinfo/\.github/workflows/release\.yml@refs/tags/.*$
    verify:
      secretRef:
        name: testdata-signing-key

  # The source is copied to the vendor location, and under the Vendor image
  # policy every image too, with all platforms and its signatures, into a
  # repository of its own below it, <vendor url>/images/<image name>. The
  # manifests pull the images from there by digest: the release runs from
  # kokumi-registry alone. Nodes must be able to pull from the vendor
  # location; the Kind setup configures that for kokumi-registry
  # (hack/kind/registry-mirror.sh). Without a url, the vendor location is
  # kokumi-registry/<namespace>/vendor/<product>.
  vendor: {}
  images:
    policy: Vendor
