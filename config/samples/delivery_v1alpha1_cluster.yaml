# The cluster Kokumi runs in. Kokumi keeps this very Cluster in its own
# namespace, created with the label delivery.kokumi.dev/in-cluster: "true",
# so applying it changes nothing. Clusters reached with a kubeconfig belong
# in a workspace of their own, next to their Secret, not in Kokumi's
# namespace: see the operator guide on Clusters.
apiVersion: delivery.kokumi.dev/v1alpha1
kind: Cluster
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
    delivery.kokumi.dev/in-cluster: "true"
  name: in-cluster
spec:
  description: The cluster Kokumi runs in
  connection: InCluster
