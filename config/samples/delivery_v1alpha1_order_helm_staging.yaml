apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: podinfo-staging
spec:
  productRef:
    name: podinfo

  values:
    ui:
      message: "Hello from staging"
    replicaCount: 2
    service:
      type: NodePort

  destination:
    url: oci://kokumi-registry.kokumi.svc.cluster.local:5000/preparation/podinfo-staging

  # A Product revision deploys here once podinfo-dev runs its own
  # Preparation of it healthily.
  promotion:
    mode: Manual
    after:
    - order: podinfo-dev
