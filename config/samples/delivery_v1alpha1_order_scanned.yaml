apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: external-secrets-scanned
spec:
  # The second Order of the vendoring Product: both Orders run the same
  # vendored images, which are scanned once.
  productRef:
    name: external-secrets-verified

  destination:
    url: oci://kokumi-registry.kokumi.svc.cluster.local:5000/preparation/external-secrets-scanned

  promotion:
    mode: Automatic
    # The Serving deploys a Preparation only once the signed reports of all
    # its images show no fixable Critical vulnerability. Its ChecksPassed
    # condition says what it waits for.
    checks:
      vulnerabilities:
        maxSeverity: Critical
        ignoreUnfixed: true
