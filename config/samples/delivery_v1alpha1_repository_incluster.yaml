apiVersion: delivery.kokumi.dev/v1alpha1
kind: Repository
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: in-cluster-external-dns
spec:
  # The controller creates the Registry in-cluster for the bundled registry.
  url: oci://kokumi-registry.kokumi.svc.cluster.local:5000/kokumi-dev/testdata/external-dns
  registryRef:
    name: in-cluster
  description: External DNS manifests in the in-cluster registry (seeded by make push-artifacts)
