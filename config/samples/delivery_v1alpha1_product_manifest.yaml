apiVersion: delivery.kokumi.dev/v1alpha1
kind: Product
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: external-secrets
spec:
  source:
    oci: oci://ghcr.io/kokumi-dev/testdata/external-secrets
    version: "0.1.0"

  # Orders of this Product may only scale the external-secrets-webhook Deployment.
  overrides:
    patches:
      policy: Listed
      targets:
        - target:
            kind: Deployment
            name: external-secrets-webhook
          paths:
            - .spec.replicas
