apiVersion: delivery.kokumi.dev/v1alpha1
kind: Product
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: podinfo-kustomize
spec:
  source:
    url: oci://ghcr.io/stefanprodan/manifests/podinfo
    version: "6.14.1"

  # Orders of this Product may only scale the podinfo Deployment.
  overrides:
    patches:
      policy: Listed
      targets:
        - target:
            kind: Deployment
            name: podinfo
          paths:
            - .spec.replicas
