apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: external-secrets-approval
spec:
  productRef:
    name: external-secrets

  patches:
    - target:
        kind: Deployment
        name: external-secrets-webhook
      set:
        .spec.replicas: "2"

  destination:
    url: oci://kokumi-registry.kokumi.svc.cluster.local:5000/preparation/external-secrets-approval

  promotion:
    mode: Manual
    approvals:
      requiredApprovals: 2
      allowedGroups:
      - release-approvers
