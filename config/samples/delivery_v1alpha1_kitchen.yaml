apiVersion: delivery.kokumi.dev/v1alpha1
kind: Kitchen
metadata:
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/managed-by: kustomize
  name: default
spec:
  argoCDURL: "https://localhost:8443"
  auth:
    adminUser:
      enabled: true
  # Kokumi signs every artifact with the key in the Secret
  # kokumi-signing/kokumi-signing-key
  # and publishes its public half in status.signing.publicKey. To rotate it,
  # list the current public key here, then delete the Secret as a cluster
  # admin; the controller generates a new key.
  # signing:
  #   trustedKeys:
  #   - name: before-2026-10
  #     publicKey: |
  #       -----BEGIN PUBLIC KEY-----
  #       ...
  #       -----END PUBLIC KEY-----
  #   # Every Product source must verify.
  #   requireSourceVerification: true
  # Resolve and vendor images through a mirror, such as a pull-through cache
  # or an air-gapped copy. Manifests keep the original image names.
  # images:
  #   mirrors:
  #   - prefix: docker.io
  #     location: oci://harbor.example.com/dockerhub
  # Scan the images Products vendor for vulnerabilities, with the Trivy
  # database "make push-artifacts" mirrors into the bundled registry, as an
  # air-gapped installation would. "scanning: {}" reads the public copy on
  # mirror.gcr.io instead.
  scanning:
    dbRepository: oci://kokumi-registry.kokumi.svc.cluster.local:5000/aquasec/trivy-db
    javaDBRepository: oci://kokumi-registry.kokumi.svc.cluster.local:5000/aquasec/trivy-java-db
