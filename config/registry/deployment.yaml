---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: system
  labels:
    app.kubernetes.io/name: kokumi
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: kokumi
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      serviceAccountName: registry
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65532
      containers:
        - name: registry
          image: ghcr.io/kokumi-dev/distribution:3.2.0-kokumi.1@sha256:ad2977e04c260aa6cf169e183be4f14e0ef6afd1f2dc931b15ee7114a37b39d8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/distribution
              readOnly: true
            - name: storage
              mountPath: /var/lib/registry
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: registry-config
        - name: storage
          persistentVolumeClaim:
            claimName: registry-pvc
