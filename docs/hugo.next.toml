# The docs of main, which the Pages workflow builds with
# --config hugo.toml,hugo.next.toml and publishes under /next/. main is not
# released yet: its install commands and examples use main instead of
# kokumiVersion, a banner says so, and search engines skip these pages.

[params]
  unreleased = true
  # layouts/_partials/custom/banner.html renders the message.
  [params.banner]
    key = "kokumi-unreleased-docs"

[cascade]
  [cascade.params]
    noindex = true
