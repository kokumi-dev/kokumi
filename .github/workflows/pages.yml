name: Deploy Website to Pages

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+'
    paths:
      - "docs/**"
      - "examples/**"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.157.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: docs/go.mod

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Build the docs of the latest release and of main
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          release=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*')
          git worktree add "${RUNNER_TEMP}/release" "${release}"
          hugo --source "${RUNNER_TEMP}/release/docs" --gc --minify \
            --baseURL "${PAGES_BASE_URL}/" --destination "${GITHUB_WORKSPACE}/public"
          hugo --source docs --config hugo.toml,hugo.next.toml --gc --minify \
            --baseURL "${PAGES_BASE_URL}/next/" --destination "${GITHUB_WORKSPACE}/public/next"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
