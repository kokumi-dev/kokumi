name: Image

on:
  workflow_call:
    outputs:
      digest:
        description: The digest of the image index.
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      manifests: ${{ steps.manifests.outputs.manifests }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels, annotations) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      # Each platform image gets its own SBOM, attached to its own digest,
      # which only the pushed index lists
      - name: List the platform manifests
        id: manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" > index.json
          manifests=$(jq -c '[.manifests[] | {
            platform: "\(.platform.os)/\(.platform.architecture)",
            name: "\(.platform.os)-\(.platform.architecture)",
            digest}]' index.json)
          echo "manifests=$manifests" >> "$GITHUB_OUTPUT"

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"

  sbom:
    name: sbom (${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      matrix:
        include: ${{ fromJSON(needs.build.outputs.manifests) }}

    steps:
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          # Read the SBOM of the UI that the image embeds: the server bundles
          # its npm packages
          SYFT_SELECT_CATALOGERS: +sbom-cataloger
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ matrix.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          upload-artifact-retention: 1
          upload-release-assets: false

  attest-sbom:
    name: attest-sbom (${{ matrix.platform }})
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.build.outputs.manifests) }}

    steps:
      - name: Download the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.name }}.spdx.json

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: sbom-${{ matrix.name }}.spdx.json
          push-to-registry: true
          create-storage-record: false

  verify:
    needs: [build, sign, attest-sbom]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify the signature
        run: |
          cosign verify "$REGISTRY/$IMAGE_NAME@$DIGEST" \
            --certificate-identity-regexp "^https://github\.com/$GITHUB_REPOSITORY/\.github/workflows/image\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-ref "$GITHUB_REF"

      - name: Verify the provenance
        run: |
          gh attestation verify "oci://$REGISTRY/$IMAGE_NAME@$DIGEST" --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/image.yml" \
            --source-ref "$GITHUB_REF"

      - name: Verify the SBOMs
        env:
          MANIFESTS: ${{ needs.build.outputs.manifests }}
        run: |
          for digest in $(jq -r '.[].digest' <<< "$MANIFESTS"); do
            gh attestation verify "oci://$REGISTRY/$IMAGE_NAME@$digest" --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/image.yml" \
              --source-ref "$GITHUB_REF" \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --format json --jq '.[0].verificationResult.statement.predicate' > sbom.spdx.json
            # The SBOM lists the npm packages the UI bundles
            jq -e 'any(.packages[].externalRefs[]?; .referenceLocator | startswith("pkg:npm/"))' sbom.spdx.json
          done

  tag:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          while read -r tag; do
            # From a single source, imagetools copies the index unchanged
            docker buildx imagetools create --tag "$tag" "$IMAGE"
            test "$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          done <<< "$TAGS"
