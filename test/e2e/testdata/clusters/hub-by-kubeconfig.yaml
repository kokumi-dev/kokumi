# A Cluster that reaches the cluster Kokumi runs in through a kubeconfig of
# https://kubernetes.default.svc, and an Environment that selects it. Argo CD
# knows that server as its own cluster; a cluster Secret for it would replace
# Argo CD's connection to it for every Application.
apiVersion: v1
kind: Secret
metadata:
  name: hub-kubeconfig
stringData:
  value: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: hub
      cluster:
        server: https://kubernetes.default.svc
    users:
    - name: kokumi
      user:
        token: not-a-token
    contexts:
    - name: hub
      context:
        cluster: hub
        user: kokumi
    current-context: hub
---
apiVersion: delivery.kokumi.dev/v1alpha1
kind: Cluster
metadata:
  name: hub
  labels:
    fleet: hub
spec:
  connection: Kubeconfig
  kubeconfig:
    secretRef:
      name: hub-kubeconfig
---
apiVersion: delivery.kokumi.dev/v1alpha1
kind: Environment
metadata:
  name: hub
spec:
  clusterSelector:
    matchLabels:
      fleet: hub
  deployer:
    type: ArgoCD
    argoCD:
      project: default
