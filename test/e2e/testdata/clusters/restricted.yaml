# An Environment of the cluster Kokumi runs in whose AppProject does not
# admit its namespace (see projects.yaml), and an Order for it.
apiVersion: delivery.kokumi.dev/v1alpha1
kind: Environment
metadata:
  name: restricted
spec:
  clusterSelector:
    matchLabels:
      delivery.kokumi.dev/in-cluster: "true"
  deployer:
    type: ArgoCD
    argoCD:
      project: ${NAMESPACE}-restricted
---
apiVersion: delivery.kokumi.dev/v1alpha1
kind: Product
metadata:
  name: podinfo-restricted
spec:
  source:
    url: oci://ghcr.io/stefanprodan/charts/podinfo
    version: "6.14.1"
  render:
    helm: {}
---
apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  name: podinfo-restricted
spec:
  productRef:
    name: podinfo-restricted
  environmentRef:
    name: restricted
  promotion:
    mode: Automatic
