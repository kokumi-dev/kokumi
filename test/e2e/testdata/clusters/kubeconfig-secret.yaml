# The kubeconfig of a cluster, as a platform admin stores it for the Cluster
# of clusters/cluster.yaml. Nothing listens at its server.
apiVersion: v1
kind: Secret
metadata:
  name: spoke-kubeconfig
stringData:
  value: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: spoke
      cluster:
        server: https://spoke.example:6443
        insecure-skip-tls-verify: true
    users:
    - name: kokumi
      user:
        token: token
    contexts:
    - name: spoke
      context:
        cluster: spoke
        user: kokumi
    current-context: spoke
