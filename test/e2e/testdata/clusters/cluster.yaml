# A Cluster reached with the kubeconfig of clusters/kubeconfig-secret.yaml,
# as a platform admin registers it.
apiVersion: delivery.kokumi.dev/v1alpha1
kind: Cluster
metadata:
  name: spoke
  labels:
    stage: staging
spec:
  description: A cluster nothing listens at
  connection: Kubeconfig
  kubeconfig:
    secretRef:
      name: spoke-kubeconfig
