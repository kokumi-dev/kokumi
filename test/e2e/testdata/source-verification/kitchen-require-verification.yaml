# Requires every Product's source to verify, and trusts the testdata key
# (hack/testdata/cosign.pub), so that a source signed with it verifies
# without any configuration on its Product.
spec:
  signing:
    requireSourceVerification: true
    trustedKeys:
    - name: testdata
      publicKey: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEf5kP1pt27xjmSdBXIWM9cWzKKdbo
        6er7IMdhMPWy3rUtdaEdxt4paHt2DPMhPxJY9cjJXsxB9hHtZS7AYfR/aw==
        -----END PUBLIC KEY-----
