# An Argo CD Application someone created by hand, named as Kokumi names the
# Application of the getting-started Order. It lacks the
# delivery.kokumi.dev/allowed-order annotation, so kokumi must neither take it
# over nor delete it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${NAME}
spec:
  project: default
  source:
    repoURL: https://github.com/stefanprodan/podinfo.git
    targetRevision: master
    path: kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: ${NAMESPACE}
