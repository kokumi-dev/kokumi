# A ServiceAccount that RBAC allows to read and write the Secrets of the
# signing namespace, and so the signing key, which admission must still
# refuse it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-secret-writer
  namespace: kokumi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-secret-writer
  namespace: kokumi-signing
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-secret-writer
  namespace: kokumi-signing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-secret-writer
subjects:
- kind: ServiceAccount
  name: e2e-secret-writer
  namespace: kokumi
