# The credentials of the registry fixture, as kubectl create secret
# docker-registry writes them.
apiVersion: v1
kind: Secret
metadata:
  name: my-org-credentials
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"private-registry.e2e-private-registry.svc.cluster.local:5000":{"username":"e2e","password":"e2e-password"}}}
