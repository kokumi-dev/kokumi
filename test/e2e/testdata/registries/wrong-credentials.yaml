# The Secret of the private-registry example with a password the registry
# fixture rejects.
apiVersion: v1
kind: Secret
metadata:
  name: my-org-credentials
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"private-registry.e2e-private-registry.svc.cluster.local:5000":{"username":"e2e","password":"wrong"}}}
