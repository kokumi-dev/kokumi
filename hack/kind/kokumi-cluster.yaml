---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kokumi
# containerd reads per-registry hosts.toml files from here;
# hack/kind/registry-mirror.sh writes the one for the bundled registry.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      # Port for registry
      - containerPort: 30050
        hostPort: 5000
        protocol: TCP
      # Port for UI
      - containerPort: 30051
        hostPort: 8080
        protocol: TCP
      # Port for Argo CD
      - containerPort: 30052
        hostPort: 8443
        protocol: TCP
      # Port for Podinfo UI
      - containerPort: 31198
        hostPort: 9898
        protocol: TCP
      # Port for Dex (OIDC issuer, see hack/dex)
      - containerPort: 30556
        hostPort: 5556
        protocol: TCP
