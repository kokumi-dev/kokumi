---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokumi-server
  namespace: kokumi
spec:
  template:
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/dex
          args:
            - serve
            - /etc/dex/cfg/config.yaml
          ports:
            - containerPort: 5556
              name: dex-http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5556
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5556
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: dex-config
              mountPath: /etc/dex/cfg
              readOnly: true
            - name: dex-data
              mountPath: /var/dex
            - name: dex-tmp
              mountPath: /tmp
      volumes:
        - name: dex-config
          configMap:
            name: dex-config
        - name: dex-data
          emptyDir: {}
        - name: dex-tmp
          emptyDir: {}
