apiVersion: delivery.kokumi.dev/v1alpha1
kind: Product
metadata:
  name: podinfo-fleet
spec:
  source:
    url: oci://ghcr.io/stefanprodan/charts/podinfo
    version: "6.14.1"

  # Every Order of the Product deploys into the namespace podinfo on every
  # cluster of its Environment, whatever namespace the Order lives in.
  targetNamespace: podinfo

  # Render the chart. The release name defaults to each Order's name, the
  # same on every cluster.
  render:
    helm:
      values:
        ui:
          message: "Hello from the edge"

  # Pin every image to the digest its tag resolves to, and pull it from where
  # it is published: the kubelet of every cluster pulls it, and only the
  # cluster Kokumi runs in reaches the bundled registry.
  images:
    policy: Pin
