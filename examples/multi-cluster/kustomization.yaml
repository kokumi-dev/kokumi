# One Order deployed to every cluster of the Environment edge, through an
# Argo CD Application per cluster: a spoke cluster at first, and the cluster
# Kokumi runs in once it joins the Environment.
#
# An admin registers the spoke cluster with its kubeconfig, and creates the
# Environment, in the namespace of the Order:
#
#   kubectl create secret generic spoke-kubeconfig -n <namespace> \
#     --from-file=value=spoke.kubeconfig
#   kubectl apply -n <namespace> -k examples/multi-cluster/platform
#
# Then:
#
#   kubectl apply -n <namespace> -k examples/multi-cluster
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- product.yaml
- order.yaml
