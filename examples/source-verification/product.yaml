apiVersion: delivery.kokumi.dev/v1alpha1
kind: Product
metadata:
  name: podinfo-verified
spec:
  source:
    url: oci://ghcr.io/stefanprodan/charts/podinfo
    version: "6.14.1"
    # The chart must carry a signature by the GitHub Actions workflow that
    # releases podinfo. Both fields are RE2 regular expressions; anchor them.
    # The SourceVerified condition says whether it does.
    verify:
      matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/stefanprodan/podinfo/\.github/workflows/release\.yml@refs/tags/.*$

  render:
    helm: {}
