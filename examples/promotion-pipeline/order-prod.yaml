apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  name: podinfo-prod
  labels:
    delivery.kokumi.dev/environment: prod
spec:
  productRef:
    name: podinfo-pipeline

  values:
    ui:
      message: "Hello from production"
    replicaCount: 3

  # You promote a Preparation here. It waits, queued, until podinfo-staging
  # ran its own Preparation of the same Product change healthily for 60
  # seconds, then deploys.
  promotion:
    mode: Manual
    after:
    - order: podinfo-staging
      soakSeconds: 60
