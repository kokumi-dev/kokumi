apiVersion: delivery.kokumi.dev/v1alpha1
kind: Product
metadata:
  name: podinfo-pipeline
spec:
  source:
    url: oci://ghcr.io/stefanprodan/charts/podinfo
    version: "6.14.1"

  render:
    helm:
      values:
        ui:
          color: "#EF6461"

  # Each stage sets its own message and replica count.
  overrides:
    values:
      policy: Listed
      paths:
      - ui.message
      - replicaCount

  # Pin every image to the digest its tag resolves to when an Order renders
  # (repo:tag@sha256:...), so a Preparation runs the same images wherever it
  # is promoted.
  images:
    policy: Pin
