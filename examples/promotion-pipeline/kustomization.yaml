# Three stages of one Product: dev deploys every change, staging deploys what
# dev runs healthily, and prod deploys what you promote once staging ran it
# healthily for a minute.
#
#   kubectl apply -n <namespace> -k examples/promotion-pipeline
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- product.yaml
- order-dev.yaml
- order-staging.yaml
- order-prod.yaml
