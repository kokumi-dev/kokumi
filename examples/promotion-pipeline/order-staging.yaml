apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  name: podinfo-staging
spec:
  productRef:
    name: podinfo-pipeline

  # The Environment of this namespace the stage deploys to. The Orders of a
  # Product in one Environment are drawn as one column of its pipeline; after
  # decides the order they deploy in.
  environmentRef:
    name: staging

  values:
    ui:
      message: "Hello from staging"
    replicaCount: 2

  # A Product change deploys here on its own, once podinfo-dev runs its own
  # Preparation of the change and Argo CD reports it healthy.
  promotion:
    mode: Automatic
    after:
    - order: podinfo-dev
