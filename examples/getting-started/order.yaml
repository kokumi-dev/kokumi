apiVersion: delivery.kokumi.dev/v1alpha1
kind: Order
metadata:
  name: podinfo
spec:
  productRef:
    name: podinfo

  # The Environment it deploys to, in the Order's namespace. Kokumi keeps the
  # Environment local in its own namespace, kokumi: the cluster it runs in.
  # The Environment cannot be changed later; another Environment is another
  # Order.
  environmentRef:
    name: local

  # Deep-merged over the Product's values; the Order's win.
  values:
    ui:
      message: "Hello from Kokumi"
    replicaCount: 2

  # Every change renders a new Preparation, an immutable OCI artifact in the
  # bundled registry. Nothing deploys until you promote a Preparation.
  promotion:
    mode: Manual
