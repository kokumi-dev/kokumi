apiVersion: delivery.kokumi.dev/v1alpha1
kind: Product
metadata:
  name: storefront
spec:
  source:
    url: oci://ghcr.io/stefanprodan/charts/podinfo
    version: "6.14.1"

  # Every Order of the Product deploys into the namespace storefront, not
  # into its own namespace, unless the Order names another one. Helm renders
  # the release into it, and Argo CD creates it when it is missing.
  targetNamespace: storefront

  render:
    helm:
      values:
        ui:
          message: "Hello from the storefront"
