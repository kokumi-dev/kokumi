apiVersion: delivery.kokumi.dev/v1alpha1
kind: Product
metadata:
  name: podinfo-private
spec:
  source:
    url: oci://ghcr.io/my-org/charts/podinfo
    version: "6.14.1"

  render:
    helm: {}

  # The Registries Kokumi connects to the source, the images and the vendored
  # copy through: for each location, the one whose url covers it, the longest
  # when several do. status.registryAccess lists which one each location uses.
  registryRefs:
  - name: my-org
